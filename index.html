    <style>

      .intro.is-travelling .intro__word { animation:none; color:#cef8ff; text-shadow:0 0 20px rgba(73,184,255,.88),0 0 56px rgba(16,80,255,.7); transform:translate(calc(-50% + var(--intro-x,0px)),calc(-50% + var(--intro-y,0px))) scale(var(--intro-scale,.16)); transition:transform .76s cubic-bezier(.16,.92,.2,1),color .28s ease,text-shadow .48s ease; }

      .lab-core::before { content:''; position:absolute; inset:0; background:linear-gradient(126deg,rgba(255,255,255,.72),transparent 23% 58%,rgba(39,203,255,.17) 79%,rgba(12,48,166,.45)); mix-blend-mode:screen; }

      .core-glyph { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; width:60%; height:38%; color:#061c68; font-size:clamp(35px,4.2vw,64px); font-weight:700; font-style:italic; letter-spacing:-.19em; text-shadow:0 1px 0 rgba(210,246,255,.8),0 -2px 7px rgba(2,20,91,.75); transform:skewX(-11deg) translateX(-.08em); }
      .core-glyph::before { content:''; position:absolute; z-index:-1; inset:-19% -5%; border-radius:18px; background:rgba(8,47,174,.2); border:1px solid rgba(198,239,255,.2); filter:blur(.2px); }
      .core-caption { position:absolute; top:calc(50% + clamp(108px,12.2vw,160px)); left:50%; z-index:3; color:rgba(217,241,255,.62); font:500 9px/1 'DM Mono',monospace; letter-spacing:.28em; white-space:nowrap; transform:translateX(-50%); transition:color .4s ease; }
      .core-caption b { color:var(--cyan); font-weight:500; }
      .core-link { position:absolute; z-index:1; top:calc(50% + clamp(96px,10vw,128px)); left:50%; width:1px; height:clamp(82px,10vw,136px); opacity:0; transform:translateX(-50%) rotate(var(--beam-angle,0deg)) scaleY(.35); transform-origin:top; background:linear-gradient(to bottom,rgba(127,233,255,.95),rgba(38,124,255,.38) 52%,transparent); box-shadow:0 0 15px rgba(43,179,255,.78); transition:opacity .35s ease,transform .58s cubic-bezier(.16,.92,.2,1); }
      .core-link::after { content:''; position:absolute; top:100%; left:50%; width:10px; height:10px; border-radius:50%; background:#c8f8ff; box-shadow:0 0 0 4px rgba(61,193,255,.15),0 0 17px 4px #168cff; transform:translate(-50%,-50%); }
      .site.has-selection .core-link { opacity:.88; transform:translateX(-50%) rotate(var(--beam-angle,0deg)) scaleY(1); }
      .site.has-selection .lab-core { box-shadow:inset 2px 2px 1px rgba(255,255,255,.34),inset -6px -7px 22px rgba(0,10,67,.54),0 0 0 1px rgba(71,184,255,.25),0 14px 34px rgba(0,0,0,.44),0 0 68px var(--active-glow,rgba(33,116,255,.84)); filter:saturate(1.12) brightness(1.08); }
      .site.has-selection .core-caption { color:#ddf8ff; }

      .dock::after { content:''; position:absolute; z-index:-2; left:6%; right:6%; bottom:14px; height:48px; border-radius:50%; background:radial-gradient(ellipse,rgba(10,96,255,.36),rgba(4,35,125,.1) 44%,transparent 72%); filter:blur(16px); }
      .dock-card { --card-glow:rgba(37,157,255,.18); --offset-y:0px; --tilt:0deg; position:absolute; bottom:18px; display:flex; width:22%; height:calc(100% - 42px); min-width:0; flex-direction:column; align-items:flex-start; justify-content:flex-end; padding:clamp(18px,1.8vw,25px); overflow:hidden; color:var(--ink); border:1px solid rgba(182,224,255,.29); border-radius:22px; background:linear-gradient(138deg,rgba(109,190,255,.22),rgba(12,57,148,.34) 28%,rgba(2,13,43,.78) 75%); box-shadow:inset 1px 1px 0 rgba(255,255,255,.22),inset -15px -18px 30px rgba(0,7,44,.28),0 18px 38px rgba(0,0,0,.32); cursor:pointer; text-align:left; transform:translateY(var(--offset-y)) rotate(var(--tilt)); transform-origin:50% 100%; transition:transform .56s cubic-bezier(.16,.92,.2,1),background .4s ease,box-shadow .5s ease,filter .42s ease,opacity .42s ease; animation:dock-arrival .85s cubic-bezier(.16,.92,.2,1) both; }
      .dock-card::before { content:''; position:absolute; inset:0; opacity:.64; background:linear-gradient(125deg,rgba(255,255,255,.31),transparent 19% 64%,var(--card-glow)),radial-gradient(circle at 22% 105%,var(--card-glow),transparent 47%); transition:opacity .35s ease; }
      .dock-card::after { content:''; position:absolute; top:-60%; left:-32%; width:28%; height:220%; opacity:.35; background:linear-gradient(90deg,transparent,rgba(222,251,255,.74),transparent); transform:rotate(18deg); transition:opacity .3s ease,left .65s cubic-bezier(.18,.8,.2,1); }
      .c1 { --card-glow:rgba(20,135,255,.52); --offset-y:25px; --tilt:-8deg; --core-aim:-10deg; --core-roll:-2deg; --beam-angle:-25deg; left:0; z-index:2; animation-delay:.08s; }
      .c2 { --card-glow:rgba(0,220,255,.34); --offset-y:12px; --tilt:-4deg; --core-aim:-5deg; --core-roll:-1deg; --beam-angle:-13deg; left:19.5%; z-index:3; animation-delay:.15s; }
      .c3 { --card-glow:rgba(49,123,255,.62); --offset-y:-1px; --tilt:1.5deg; --core-aim:0deg; --core-roll:0deg; --beam-angle:0deg; left:39%; z-index:4; animation-delay:.22s; }
      .c4 { --card-glow:rgba(47,145,255,.44); --offset-y:-10px; --tilt:5deg; --core-aim:5deg; --core-roll:1deg; --beam-angle:14deg; left:58.5%; z-index:3; animation-delay:.29s; }

      .dock-card:hover,.dock-card:focus-visible,.dock-card.is-active { z-index:12; background:linear-gradient(138deg,rgba(154,220,255,.34),rgba(17,84,206,.52) 35%,rgba(3,15,55,.84)); box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),inset -15px -18px 30px rgba(0,7,44,.3),0 29px 45px rgba(0,0,0,.42),0 0 37px var(--card-glow); transform:translateY(calc(var(--offset-y) - 29px)) rotate(var(--tilt)) scale(1.025); outline:0; }
      .dock:has(.dock-card:hover) .dock-card:not(:hover),.dock:has(.dock-card.is-active) .dock-card:not(.is-active) { filter:saturate(.72) brightness(.69); opacity:.67; }
      .dock-card:hover::before,.dock-card:focus-visible::before,.dock-card.is-active::before { opacity:1; }
      .dock-card:hover::after,.dock-card:focus-visible::after,.dock-card.is-active::after { left:125%; opacity:.72; }
      .dock-card__number { position:absolute; top:20px; right:22px; color:rgba(210,239,255,.62); font:400 clamp(27px,3.2vw,43px)/1 'Outfit',sans-serif; letter-spacing:-.08em; transition:color .3s ease,transform .4s ease; }
      .dock-card:hover .dock-card__number,.dock-card:focus-visible .dock-card__number,.dock-card.is-active .dock-card__number { color:#dcfbff; transform:translateY(-4px); }
      .dock-card__eyebrow { position:relative; color:#a6ebff; font:500 9px/1.3 'DM Mono',monospace; letter-spacing:.15em; text-transform:uppercase; }
      .dock-card h2 { position:relative; margin:12px 0 5px; font-size:clamp(18px,1.65vw,25px); font-weight:600; letter-spacing:-.065em; line-height:1.15; text-shadow:0 2px 12px rgba(2,20,70,.45); }
      .dock-card p { position:relative; margin:0; color:rgba(218,241,255,.7); font-size:12px; line-height:1.35; }
      .dock-card__hint { position:relative; display:block; max-height:0; margin-top:0; overflow:hidden; color:#e2fbff; font:500 9px/1.3 'DM Mono',monospace; letter-spacing:.1em; opacity:0; transition:max-height .34s ease,margin .34s ease,opacity .24s ease; }
      .dock-card:hover .dock-card__hint,.dock-card:focus-visible .dock-card__hint,.dock-card.is-active .dock-card__hint { max-height:20px; margin-top:13px; opacity:1; }
      .dock-card[data-url] .dock-card__hint::after { content:' ↗'; color:var(--cyan); }
      .coming-soon { position:fixed; z-index:20; inset:0; display:grid; place-items:center; padding:24px; visibility:hidden; opacity:0; background:rgba(0,4,14,.77); backdrop-filter:blur(14px); transition:opacity .3s ease,visibility .3s ease; }
      .coming-soon.is-open { visibility:visible; opacity:1; }
      .coming-soon__panel { position:relative; width:min(900px,100%); height:min(72svh,640px); min-height:420px; overflow:hidden; border:1px solid rgba(135,215,255,.46); border-radius:22px; background:#020817; box-shadow:0 28px 70px rgba(0,2,15,.66),0 0 55px rgba(0,110,255,.16),inset 0 1px 0 rgba(223,249,255,.18); transform:translateY(15px) scale(.97); transition:transform .34s cubic-bezier(.2,.8,.2,1); }
      .coming-soon.is-open .coming-soon__panel { transform:translateY(0) scale(1); }
      .three-d-paper-frame { display:block; width:100%; height:100%; border:0; background:#020817; }

      .coming-soon__context span { display:block; color:#27d5ff; font:500 10px/1.3 'DM Mono',monospace; letter-spacing:.14em; }
      .coming-soon__context strong { display:block; margin-top:8px; color:#f3fbff; font:500 clamp(17px,2vw,25px)/1.05 'Outfit','Noto Sans SC',sans-serif; letter-spacing:-.05em; }
      .coming-soon__context p { margin:7px 0 0; color:rgba(205,235,255,.70); font-size:11px; line-height:1.55; }
      .coming-soon__close { position:absolute; right:17px; top:17px; z-index:2; display:grid; width:34px; height:34px; place-items:center; border:1px solid rgba(184,232,255,.48); border-radius:50%; color:#fff; background:rgba(2,10,30,.54); backdrop-filter:blur(8px); cursor:pointer; font:300 26px/1 'Outfit',sans-serif; transition:background .2s ease,transform .2s ease; }
      .coming-soon__close:hover,.coming-soon__close:focus-visible { background:rgba(255,255,255,.15); transform:rotate(90deg); outline:0; }
      @keyframes intro-word-arrive { from { opacity:0; transform:translate(-50%,-50%) scale(.46); filter:blur(9px); } to { opacity:1; transform:translate(-50%,-50%) scale(1); filter:blur(0); } }

      @keyframes float { 0%,100% { transform:translate3d(0,0,0) rotateZ(0); } 50% { transform:translate3d(0,-17px,18px) rotateZ(1.4deg); } }
      @keyframes dock-arrival { from { opacity:0; transform:translateY(calc(var(--offset-y) + 58px)) rotate(var(--tilt)); } to { opacity:1; transform:translateY(var(--offset-y)) rotate(var(--tilt)); } }
      @keyframes sweep { 0%,20% { transform:translateX(-25%) rotate(21deg); opacity:0; } 35% { opacity:.72; } 58%,100% { transform:translateX(160%) rotate(21deg); opacity:0; } }
      @media (max-width:760px) { body { overflow:auto; } .intro__word { font-size:clamp(112px,31vw,168px); } .intro__word small { bottom:-1.1em; font-size:7px; } .site { min-height:100svh; overflow:hidden; } .nav { height:70px; padding:0 22px; } .brand { font-size:24px; } .nav__state { font-size:8px; } .hero { height:calc(100svh - 70px); min-height:620px; padding:0 0 20px; } .core-stage { min-height:310px; } .core-stage::before { width:86vw; } .core-stage::after { width:72vw; } .core-float { width:166px; } .core-caption { top:calc(50% + 108px); font-size:8px; } .core-link { display:none; } .dock { display:flex; width:calc(100% - 32px); height:215px; overflow-x:auto; overflow-y:visible; perspective:none; scroll-snap-type:x mandatory; scrollbar-width:none; } .dock::before { left:0; top:1px; } .dock::-webkit-scrollbar { display:none; } .dock-card,.c1,.c2,.c3,.c4,.c5 { position:relative; bottom:auto; left:auto; flex:0 0 172px; width:172px; height:190px; margin-top:19px; padding:20px; transform:translateY(0) rotate(0); scroll-snap-align:center; } .dock-card:hover,.dock-card:focus-visible,.dock-card.is-active { transform:translateY(-10px) scale(1.01); } .dock-card h2 { font-size:20px; } .dock-card__number { right:16px; top:17px; font-size:31px; } }

    </style>

  <body>
    <div class="intro" id="intro" aria-hidden="true"><span class="intro__word">TBN<small>LABORATORY / ENTER</small></span></div>
    <div class="site" id="top">
      <header class="nav">
        <a class="brand" href="#top" aria-label="TBN 实验室首页">TBN <span>LAB</span><i></i></a>
        <span class="nav__state">LABORATORY / 01—05</span>
      </header>
      <main class="hero">
        <section class="core-stage" aria-label="TBN 实验室核心">
          <div class="core-float" aria-hidden="true"><div class="lab-core"><span class="core-glyph">TBN</span></div></div>
          <span class="core-link" aria-hidden="true"></span>
          <span class="core-caption"><b>●</b>&nbsp;&nbsp; SELECT A DIRECTION</span>
        </section>
        <section class="dock" aria-label="TBN 实验方向，选择一项进入">
          <button class="dock-card c1" data-title="夜场与酒吧" data-copy="从产品、运营到推广，回到真实的门店现场，解决真正影响体验的每一个环节。"><span class="dock-card__number">01</span><span class="dock-card__eyebrow">Nightlife</span><h2>夜场与酒吧</h2><p>Nightlife &amp; Bar</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
          <button class="dock-card c2" data-url="artists/index.html" data-title="艺人与演出" data-copy="不把舞台当成名单。让合适的人、内容与场地在同一个晚上形成真正的化学反应。"><span class="dock-card__number">02</span><span class="dock-card__eyebrow">Live sets</span><h2>艺人与演出</h2><p>Artists &amp; Live</p><span class="dock-card__hint">TBN ARTISTS</span></button>
          <button class="dock-card c3" data-title="空间与体验" data-copy="研究动线、情绪和每一次停留。好的空间会自然把人留住，不需要大声解释自己。"><span class="dock-card__number">03</span><span class="dock-card__eyebrow">Spatial</span><h2>空间与体验</h2><p>Space &amp; Experience</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
          <button class="dock-card c4" data-title="商业策划" data-copy="让定位、内容与执行在一条线上。每个方案都从现实条件出发，才有持续发生的机会。"><span class="dock-card__number">04</span><span class="dock-card__eyebrow">Planning</span><h2>商业策划</h2><p>Business Planning</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
          <button class="dock-card c5" data-title="发起人与伙伴" data-copy="TBN 实验室相信长期的合作不只是交换资源，而是一起把有价值的事做得更完整。"><span class="dock-card__number">05</span><span class="dock-card__eyebrow">People</span><h2>发起人与伙伴</h2><p>People &amp; Partners</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
        </section>
      </main>
    </div>
    <div class="coming-soon" id="coming-soon" role="dialog" aria-modal="true" aria-label="建站中，ThreeDPaper 交互展示" aria-hidden="true">
      <div class="coming-soon__panel"><div class="coming-soon__context"><span id="coming-soon-kicker">TBN LAB / 01</span><strong id="coming-soon-title">夜场与酒吧</strong><p>正在建设，敬请期待。</p></div><button class="coming-soon__close" type="button" aria-label="关闭提示">×</button><iframe class="three-d-paper-frame" title="TBN LAB — Coming Soon" src="threeui/3d-paper/sources/tbn-coming-soon-blue.html" sandbox="allow-scripts" loading="eager"></iframe></div>
    </div>
    <script>
      const cards=[...document.querySelectorAll('.dock-card')];
      const modal=document.querySelector('#coming-soon');
      const close=document.querySelector('.coming-soon__close');
      const comingSoonKicker=document.querySelector('#coming-soon-kicker');
      const comingSoonTitle=document.querySelector('#coming-soon-title');
      const root=document.documentElement;
      const site=document.querySelector('.site');
      const intro=document.querySelector('#intro');
      let previousFocus;
      const navigation=performance.getEntriesByType('navigation')[0];
      const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let hasSeenIntro=false;
      try { hasSeenIntro=sessionStorage.getItem('tbn-lab-home-intro')==='seen'; } catch (_) {}
      const playIntro=!reducedMotion&&(navigation?.type==='reload'||!hasSeenIntro);
      const runIntro=()=>{
        document.body.classList.add('intro-pending');
        try { sessionStorage.setItem('tbn-lab-home-intro','seen'); } catch (_) {}
        window.setTimeout(()=>{
          const target=document.querySelector('.core-glyph').getBoundingClientRect();
          intro.style.setProperty('--intro-x',`${target.left+target.width/2-window.innerWidth/2}px`);
          intro.style.setProperty('--intro-y',`${target.top+target.height/2-window.innerHeight/2}px`);
          intro.style.setProperty('--intro-scale',window.innerWidth<760?'.42':'.16');
          intro.classList.add('is-travelling');
        },650);
        window.setTimeout(()=>{
          site.classList.add('intro-lit');
          document.body.classList.remove('intro-pending');
        },1220);
        window.setTimeout(()=>intro.classList.add('is-exiting'),1390);
        window.setTimeout(()=>intro.remove(),2000);
      };
      if(playIntro) runIntro(); else intro.remove();
      const select=card=>{
        cards.forEach(item=>item.classList.toggle('is-active',item===card));
        site.classList.add('has-selection');
        const styles=getComputedStyle(card);
        root.style.setProperty('--core-aim',styles.getPropertyValue('--core-aim').trim());
        root.style.setProperty('--core-roll',styles.getPropertyValue('--core-roll').trim());
        root.style.setProperty('--beam-angle',styles.getPropertyValue('--beam-angle').trim());
        root.style.setProperty('--active-glow',styles.getPropertyValue('--card-glow').trim());
      };
      const openModal=card=>{ select(card); previousFocus=card; comingSoonKicker.textContent='TBN LAB / '+card.querySelector('.dock-card__number').textContent; comingSoonTitle.textContent=card.dataset.title; modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); close.focus(); };
      const closeModal=()=>{ modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true'); previousFocus?.focus(); };
      cards.forEach(card=>{ card.addEventListener('click',()=>{ if(card.dataset.url){ window.location.assign(card.dataset.url); return; } openModal(card); }); card.addEventListener('focus',()=>select(card)); });
      window.addEventListener('pointermove',event=>{ if(event.pointerType!=='mouse') return; root.style.setProperty('--mx',((event.clientX/window.innerWidth)-.5).toFixed(3)); root.style.setProperty('--my',((event.clientY/window.innerHeight)-.5).toFixed(3)); },{passive:true});
      close.addEventListener('click',closeModal);
      modal.addEventListener('click',event=>{ if(event.target===modal) closeModal(); });
      document.addEventListener('keydown',event=>{ if(event.key==='Escape'&&modal.classList.contains('is-open')) closeModal(); });
    </script>
  </body>
</html>
