  <body>
    <main class="site">
      <div class="ambient"></div>
      <header class="nav">
        <a class="brand" href="#top" aria-label="TBN 实验室首页">TBN <span>LAB</span><i class="brand-dot"></i></a>
      </header>
      <section class="hero" id="top" aria-label="TBN 实验方向">
        <div class="scene-copy" aria-hidden="true"><span class="scene-copy__kicker">SELECT / 01 — 05</span><span class="scene-copy__word">TBN LAB</span><span class="scene-copy__left">EXPERIMENTAL INDEX</span><span class="scene-copy__bottom">HOVER TO RAISE · CLICK TO ENTER</span></div>
        <div class="stage" id="lab" aria-label="TBN 实验方向，悬停或点击卡片了解更多">
          <button class="card c1" data-title="夜场与酒吧" data-copy="从产品、运营到推广，回到真实的门店现场，解决真正影响体验的每一个环节。"><span class="card__sup">01 / nightlife</span><h2>夜场与酒吧</h2><p>Nightlife &amp; Bar</p><span class="card__mark"></span><span class="card__info">让现场更有记忆点，也更经得起日常运营。</span><span class="card__index">01</span></button>
          <button class="card c2" data-url="artists/index.html" data-title="艺人与演出" data-copy="不把舞台当成名单。让合适的人、内容与场地在同一个晚上形成真正的化学反应。"><span class="card__sup">02 / live sets</span><h2>艺人与演出</h2><p>Artists &amp; Live</p><span class="card__mark"></span><span class="card__info">进入 TBN ARTISTS 网站 ↗</span><span class="card__index">02</span></button>
          <button class="card c3" data-title="空间与体验" data-copy="研究动线、情绪和每一次停留。好的空间会自然把人留住，不需要大声解释自己。"><span class="card__sup">03 / spatial</span><h2>空间与体验</h2><p>Space &amp; Experience</p><span class="card__mark"></span><span class="card__info">让抵达、停留与离开都有理由。</span><span class="card__index">03</span></button>
          <button class="card c4" data-title="商业策划" data-copy="让定位、内容与执行在一条线上。每个方案都从现实条件出发，才有持续发生的机会。"><span class="card__sup">04 / planning</span><h2>商业策划</h2><p>Business Planning</p><span class="card__mark"></span><span class="card__info">不只提出方向，也考虑怎样落在今天。</span><span class="card__index">04</span></button>
          <button class="card c5" data-title="发起人与伙伴" data-copy="TBN 实验室相信长期的合作不只是交换资源，而是一起把有价值的事做得更完整。"><span class="card__sup">05 / people</span><h2>发起人与伙伴</h2><p>People &amp; Partners</p><span class="card__mark"></span><span class="card__info">为同一件值得做的事，找到彼此。</span><span class="card__index">05</span></button>
        </div>
      </section>
    </main>
    <div class="coming-soon" id="coming-soon" role="dialog" aria-modal="true" aria-label="建站中，ThreeDPaper 交互展示" aria-hidden="true">
      <div class="coming-soon__panel"><div class="coming-soon__context"><span id="coming-soon-kicker">TBN LAB / 01</span><strong id="coming-soon-title">夜场与酒吧</strong><p>正在建设，敬请期待。</p></div><button class="coming-soon__close" type="button" aria-label="关闭提示">×</button><iframe class="three-d-paper-frame" title="TBN LAB — Coming Soon" src="threeui/3d-paper/sources/tbn-coming-soon-blue.html" sandbox="allow-scripts" loading="eager"></iframe></div>
    </div>
    <script>
      const cards=[...document.querySelectorAll('.card')]; const modal=document.querySelector('#coming-soon'); const close=document.querySelector('.coming-soon__close'); const comingSoonKicker=document.querySelector('#coming-soon-kicker'); const comingSoonTitle=document.querySelector('#coming-soon-title'); let previousFocus;
      const select=card=>{ cards.forEach(item=>item.classList.remove('is-active')); card.classList.add('is-active'); };
      const openModal=card=>{ select(card); previousFocus=card; comingSoonKicker.textContent=`TBN LAB / ${card.querySelector('.card__index').textContent}`; comingSoonTitle.textContent=card.dataset.title; modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); close.focus(); };
      const closeModal=()=>{ modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true'); previousFocus?.focus(); };
      const resetCardTilt=card=>{ card.style.setProperty('--px','0px'); card.style.setProperty('--py','0px'); };
      cards.forEach(card=>{
        card.addEventListener('click',()=>{ if(card.dataset.url) { window.location.assign(card.dataset.url); return; } openModal(card); });
        card.addEventListener('focus',()=>select(card));
        card.addEventListener('pointermove',event=>{
          if(event.pointerType!=='mouse') return;
          const rect=card.getBoundingClientRect();
          const x=(event.clientX-rect.left)/rect.width-.5;
          const y=(event.clientY-rect.top)/rect.height-.5;
          card.style.setProperty('--px',`${x*8}px`);
          card.style.setProperty('--py',`${y*6}px`);
        });
        card.addEventListener('pointerleave',()=>resetCardTilt(card));
      });
      close.addEventListener('click',closeModal); modal.addEventListener('click',event=>{ if(event.target===modal) closeModal(); }); document.addEventListener('keydown',event=>{ if(event.key==='Escape'&&modal.classList.contains('is-open')) closeModal(); });
    </script>
    <script type="application/x-tbn-disabled">

        ['01 / NIGHTLIFE','夜场与酒吧','Nightlife & Bar','01'],
        ['02 / LIVE SETS','艺人与演出','Artists & Live','02'],
        ['03 / SPATIAL','空间与体验','Space & Experience','03'],
        ['04 / PLANNING','商业策划','Business Planning','04'],
        ['05 / PEOPLE','发起人与伙伴','People & Partners','05']

          const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,premultipliedAlpha:false});

          const keyLight=new THREE.DirectionalLight(0xc4f1ff,2.6); keyLight.position.set(-5,6,7); scene.add(keyLight);
          const blueLight=new THREE.PointLight(0x087dff,10,18,2); blueLight.position.set(0,-1.8,4); scene.add(blueLight);
          const cyanLight=new THREE.PointLight(0x24cfff,5,13,2); cyanLight.position.set(5,3,4); scene.add(cyanLight);

          const roundedPath=(ctx,x,y,w,h,r)=>{ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); };
          const makeFace=(label,index)=>{
            const canvas=document.createElement('canvas'); canvas.width=768; canvas.height=1000;
            const ctx=canvas.getContext('2d'); const inset=16; const radius=52;
            roundedPath(ctx,inset,inset,canvas.width-inset*2,canvas.height-inset*2,radius); ctx.clip();

            surface.addColorStop(0,'rgb(95,146,201)'); surface.addColorStop(.26,'rgb(25,102,214)'); surface.addColorStop(.61,'rgb(5,39,116)'); surface.addColorStop(1,'rgb(2,11,36)'); ctx.fillStyle=surface; ctx.fillRect(0,0,768,1000);
            const glow=ctx.createRadialGradient(570,170,0,570,170,350); glow.addColorStop(0,'rgba(74,207,255,.48)'); glow.addColorStop(.45,'rgba(20,93,245,.18)'); glow.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=glow; ctx.fillRect(0,0,768,1000);
            const sheen=ctx.createLinearGradient(0,0,550,580); sheen.addColorStop(0,'rgba(255,255,255,.30)'); sheen.addColorStop(.24,'rgba(255,255,255,.06)'); sheen.addColorStop(.58,'rgba(255,255,255,0)'); ctx.fillStyle=sheen; ctx.fillRect(0,0,768,1000);
            ctx.fillStyle='rgba(210,241,255,.09)'; for(let y=48;y<960;y+=24) ctx.fillRect(36,y,696,1);
            ctx.strokeStyle='rgba(197,242,255,.74)'; ctx.lineWidth=3; roundedPath(ctx,inset+2,inset+2,canvas.width-inset*2-4,canvas.height-inset*2-4,radius-3); ctx.stroke();
            ctx.fillStyle='rgba(218,244,255,.93)'; ctx.font='500 25px "DM Mono", monospace'; ctx.letterSpacing='2px'; ctx.fillText(label[0],72,134);
            ctx.fillStyle='#f2fbff'; ctx.font='600 67px "Noto Sans SC", sans-serif'; ctx.fillText(label[1],72,250);
            ctx.fillStyle='rgba(218,240,255,.88)'; ctx.font='400 30px Outfit, sans-serif'; ctx.fillText(label[2],72,306);
            ctx.strokeStyle='#24cfff'; ctx.lineWidth=7; ctx.lineCap='square'; [0,28,56].forEach(offset=>{ctx.beginPath();ctx.moveTo(75+offset,805);ctx.lineTo(75+offset,910);ctx.stroke();});
            ctx.fillStyle='#b8efff'; ctx.font='400 114px Outfit, sans-serif'; ctx.fillText(label[3],568,902);
            const texture=new THREE.CanvasTexture(canvas); texture.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8); texture.encoding=THREE.sRGBEncoding; return texture;
          };

          const cardGeometry=new THREE.BoxGeometry(3.38,4.42,.16,1,1,1);
          const faceGeometry=new THREE.PlaneGeometry(3.39,4.43);
          const cardSpecs=[
            {x:-3.65,y:-1.2,z:.9,ry:.22,rz:-.12},
            {x:-1.82,y:-.6,z:.45,ry:.11,rz:-.065},
            {x:0,y:0,z:0,ry:0,rz:0},
            {x:1.82,y:.59,z:-.45,ry:-.11,rz:.065},
            {x:3.65,y:1.18,z:-.9,ry:-.22,rz:.12}
          ];
          const models=[]; const targets=[]; const faces=[];
          cardSpecs.forEach((spec,index)=>{
            const group=new THREE.Group(); group.position.set(spec.x,spec.y,spec.z); group.rotation.set(0,spec.ry,spec.rz);
            const body=new THREE.Mesh(cardGeometry,new THREE.MeshPhysicalMaterial({color:index===2?0x0e72ff:0x06275e,roughness:.22,metalness:.16,transmission:.08,transparent:true,opacity:.36,clearcoat:.34,clearcoatRoughness:.2}));
            const face=new THREE.Mesh(faceGeometry,new THREE.MeshBasicMaterial({map:makeFace(labels[index]),transparent:true,depthWrite:false})); face.position.z=.102; face.userData.cardIndex=index; group.add(body,face); scene.add(group); models.push({group,base:spec}); targets.push({hover:false}); faces.push(face);
          });

          const raycaster=new THREE.Raycaster(); const pointer=new THREE.Vector2(0,0); let hoverIndex=-1; let lastTime=performance.now();
          const resize=()=>{ const desktop=window.matchMedia('(min-width:761px)').matches; renderer.domElement.style.display=desktop?'block':'none'; stage.classList.toggle('is-webgl',desktop); if(!desktop) return; const rect=stage.getBoundingClientRect(); renderer.setSize(rect.width,rect.height,false); camera.aspect=rect.width/rect.height; camera.updateProjectionMatrix(); };
          const pick=event=>{ const rect=renderer.domElement.getBoundingClientRect(); pointer.x=((event.clientX-rect.left)/rect.width)*2-1; pointer.y=-((event.clientY-rect.top)/rect.height)*2+1; raycaster.setFromCamera(pointer,camera); const hit=raycaster.intersectObjects(faces,false)[0]; hoverIndex=hit?hit.object.userData.cardIndex:-1; renderer.domElement.style.cursor=hoverIndex>-1?'pointer':'default'; models.forEach((model,index)=>targets[index].hover=index===hoverIndex); };
          renderer.domElement.addEventListener('pointermove',pick);
          renderer.domElement.addEventListener('pointerleave',()=>{hoverIndex=-1; models.forEach(model=>{model.userData=false;}); targets.forEach(target=>target.hover=false); renderer.domElement.style.cursor='default';});
          renderer.domElement.addEventListener('click',()=>{ if(hoverIndex>-1) document.querySelectorAll('.card')[hoverIndex].click(); });
          renderer.domElement.addEventListener('keydown',event=>{ if((event.key==='Enter'||event.key===' ')&&hoverIndex>-1){ event.preventDefault(); document.querySelectorAll('.card')[hoverIndex].click(); } });
          const render=now=>{ const dt=Math.min(.05,(now-lastTime)/1000); lastTime=now; const smooth=1-Math.exp(-9*dt);
            models.forEach((model,index)=>{ const spec=model.base; const active=targets[index].hover; const lift=active?.52:0; const align=active?0:spec.ry; const roll=active?spec.rz*.28:spec.rz; model.group.position.x+=((spec.x+pointer.x*.08)-model.group.position.x)*smooth; model.group.position.y+=((spec.y+lift-pointer.y*.05)-model.group.position.y)*smooth; model.group.position.z+=((spec.z+(active?.46:0))-model.group.position.z)*smooth; model.group.rotation.y+=(align-model.group.rotation.y)*smooth; model.group.rotation.z+=(roll-model.group.rotation.z)*smooth; });
            renderer.render(scene,camera); requestAnimationFrame(render); };
          window.addEventListener('resize',resize,{passive:true}); resize(); requestAnimationFrame(render);
        } catch(error) { console.warn('TBN 3D cards fallback to DOM cards.',error); }
      }
    </script>
  </body>
</html>
