<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#030714">
    <meta name="description" content="TBN LAB — 实验方向选择器">
    <title>TBN 实验室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root { --ink:#eff9ff; --dim:rgba(213,234,255,.57); --cyan:#2fd6ff; --void:#02040a; }
      * { box-sizing:border-box; }
      html,body { min-height:100%; margin:0; background:var(--void); color:var(--ink); }
      body { overflow:hidden; font-family:'Outfit','Noto Sans SC',sans-serif; -webkit-font-smoothing:antialiased; }
      button,a { font:inherit; }
      .site { isolation:isolate; position:relative; min-height:100svh; overflow:hidden; background:radial-gradient(75% 96% at 50% 19%,#0d2c77 0%,#071b4c 17%,#030817 46%,#010205 82%); }
      .site::before { content:''; position:absolute; z-index:-2; inset:-30%; background:radial-gradient(ellipse at 50% 22%,rgba(48,129,255,.26),transparent 24%),radial-gradient(ellipse at 15% 0%,rgba(32,107,255,.18),transparent 23%),radial-gradient(ellipse at 82% 69%,rgba(5,69,204,.14),transparent 22%); filter:blur(22px); pointer-events:none; }
      .site::after { content:''; position:absolute; inset:0; z-index:4; pointer-events:none; opacity:.48; background-image:linear-gradient(rgba(203,235,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(203,235,255,.021) 1px,transparent 1px); background-size:40px 40px; mask-image:radial-gradient(ellipse at 50% 35%,#000 0%,transparent 69%); }
      .nav { position:relative; z-index:8; display:flex; align-items:center; justify-content:space-between; height:88px; padding:0 clamp(25px,5.2vw,80px); }
      .brand { color:#f4fbff; font-size:clamp(22px,2.2vw,30px); font-weight:600; letter-spacing:-.07em; text-decoration:none; }
      .brand span { color:var(--cyan); }
      .brand i { display:inline-block; width:7px; height:7px; margin:0 0 .16em .2em; border-radius:50%; background:var(--cyan); box-shadow:0 0 14px var(--cyan); }
      .nav__state { color:rgba(214,238,255,.68); font:500 9px/1 'DM Mono',monospace; letter-spacing:.2em; }
      .hero { position:relative; z-index:1; display:flex; flex-direction:column; height:calc(100svh - 88px); min-height:600px; padding:0 clamp(25px,5.2vw,80px) clamp(26px,4.2vh,52px); }
      .core-stage { position:relative; display:grid; flex:1; min-height:315px; place-items:center; perspective:1100px; perspective-origin:50% 42%; }
      .core-stage::before { content:''; position:absolute; top:50%; left:50%; width:min(37vw,480px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(46,146,255,.32),rgba(24,96,255,.09) 36%,transparent 68%); filter:blur(18px); transform:translate(-50%,-50%); }
      .core-stage::after { content:''; position:absolute; top:62%; left:50%; width:min(32vw,350px); height:60px; border-radius:50%; background:radial-gradient(ellipse,rgba(31,142,255,.46),rgba(8,53,174,.16) 42%,transparent 72%); filter:blur(18px); transform:translateX(-50%) rotateX(72deg); }
      .core-float { position:relative; z-index:2; width:clamp(150px,15.3vw,224px); aspect-ratio:1; transform-style:preserve-3d; animation:float 5.8s cubic-bezier(.42,0,.58,1) infinite; }
      .lab-core { position:absolute; inset:0; display:grid; place-items:center; overflow:hidden; border:1px solid rgba(195,237,255,.88); border-radius:clamp(28px,3.2vw,45px); background:linear-gradient(142deg,rgba(177,230,255,.48),rgba(43,123,255,.49) 29%,rgba(9,34,113,.87) 66%,rgba(2,7,27,.96)); box-shadow:inset 2px 2px 1px rgba(255,255,255,.34),inset -6px -7px 22px rgba(0,10,67,.54),0 0 0 1px rgba(71,184,255,.16),0 14px 34px rgba(0,0,0,.44),0 0 46px rgba(33,116,255,.84); transform:rotateX(calc(var(--my,0) * -5deg)) rotateY(calc(var(--mx,0) * 9deg)) rotateZ(-8deg); transition:transform .28s ease-out; }
      .lab-core::before { content:''; position:absolute; inset:0; background:linear-gradient(126deg,rgba(255,255,255,.72),transparent 23% 58%,rgba(39,203,255,.17) 79%,rgba(12,48,166,.45)); mix-blend-mode:screen; }
      .lab-core::after { content:''; position:absolute; left:-38%; top:-52%; width:92%; height:190%; background:linear-gradient(90deg,transparent,rgba(232,252,255,.58),transparent); transform:rotate(21deg); animation:sweep 5.8s ease-in-out infinite; }
      .core-glyph { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; width:60%; height:38%; color:#061c68; font-size:clamp(35px,4.2vw,64px); font-weight:700; font-style:italic; letter-spacing:-.19em; text-shadow:0 1px 0 rgba(210,246,255,.8),0 -2px 7px rgba(2,20,91,.75); transform:skewX(-11deg) translateX(-.08em); }
      .core-glyph::before { content:''; position:absolute; z-index:-1; inset:-19% -5%; border-radius:18px; background:rgba(8,47,174,.2); border:1px solid rgba(198,239,255,.2); filter:blur(.2px); }
      .core-caption { position:absolute; top:calc(50% + clamp(108px,12.2vw,160px)); left:50%; z-index:3; color:rgba(217,241,255,.62); font:500 9px/1 'DM Mono',monospace; letter-spacing:.28em; white-space:nowrap; transform:translateX(-50%); }
      .core-caption b { color:var(--cyan); font-weight:500; }
      .dock { position:relative; z-index:6; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); width:min(1280px,100%); min-height:195px; margin:0 auto; overflow:visible; border:1px solid rgba(189,226,255,.18); border-radius:25px; background:linear-gradient(108deg,rgba(11,18,35,.91),rgba(7,12,26,.82) 48%,rgba(8,16,36,.9)); box-shadow:inset 0 1px 0 rgba(218,240,255,.08),0 26px 58px rgba(0,0,0,.34),0 0 46px rgba(9,61,190,.12); backdrop-filter:blur(19px); -webkit-backdrop-filter:blur(19px); }
      .dock::before { content:''; position:absolute; z-index:0; inset:0; border-radius:inherit; pointer-events:none; background:linear-gradient(90deg,rgba(102,172,255,.055),transparent 23% 75%,rgba(71,153,255,.07)); }
      .dock-card { --card-glow:rgba(37,157,255,.18); position:relative; z-index:1; display:flex; min-width:0; flex-direction:column; align-items:flex-start; justify-content:flex-end; padding:clamp(19px,2.1vw,31px); overflow:hidden; color:var(--ink); border:0; border-right:1px solid rgba(191,226,255,.12); background:transparent; cursor:pointer; text-align:left; transition:transform .48s cubic-bezier(.2,.9,.25,1),background .35s ease,box-shadow .4s ease; }
      .dock-card:last-child { border-right:0; }
      .dock-card::before { content:''; position:absolute; inset:0; opacity:0; background:radial-gradient(circle at 50% 90%,var(--card-glow),transparent 67%); transition:opacity .35s ease; }
      .dock-card::after { content:''; position:absolute; right:0; top:15%; bottom:15%; width:1px; background:linear-gradient(transparent,rgba(174,232,255,.55),transparent); opacity:0; transition:opacity .3s ease; }
      .dock-card:hover,.dock-card:focus-visible,.dock-card.is-active { z-index:4; background:linear-gradient(180deg,rgba(39,101,214,.19),rgba(5,13,37,.54)); box-shadow:0 -19px 40px rgba(0,0,0,.24),0 0 30px var(--card-glow),inset 0 1px 0 rgba(229,249,255,.24); transform:translateY(-18px); outline:0; }
      .dock-card:hover::before,.dock-card:focus-visible::before,.dock-card.is-active::before,.dock-card:hover::after,.dock-card:focus-visible::after,.dock-card.is-active::after { opacity:1; }
      .dock-card__number { position:absolute; top:20px; right:22px; color:rgba(195,232,255,.53); font:400 clamp(26px,3.2vw,43px)/1 'Outfit',sans-serif; letter-spacing:-.08em; transition:color .3s ease,transform .4s ease; }
      .dock-card:hover .dock-card__number,.dock-card:focus-visible .dock-card__number,.dock-card.is-active .dock-card__number { color:#bff2ff; transform:translateY(-4px); }
      .dock-card__eyebrow { position:relative; color:#84dfff; font:500 9px/1.3 'DM Mono',monospace; letter-spacing:.15em; text-transform:uppercase; }
      .dock-card h2 { position:relative; margin:12px 0 5px; font-size:clamp(18px,1.65vw,25px); font-weight:600; letter-spacing:-.065em; line-height:1.15; }
      .dock-card p { position:relative; margin:0; color:var(--dim); font-size:12px; line-height:1.35; }
      .dock-card__hint { position:relative; display:block; max-height:0; margin-top:0; overflow:hidden; color:#d7f5ff; font:500 9px/1.3 'DM Mono',monospace; letter-spacing:.1em; opacity:0; transition:max-height .34s ease,margin .34s ease,opacity .24s ease; }
      .dock-card:hover .dock-card__hint,.dock-card:focus-visible .dock-card__hint,.dock-card.is-active .dock-card__hint { max-height:20px; margin-top:13px; opacity:1; }
      .c1 { --card-glow:rgba(16,148,255,.36); } .c2 { --card-glow:rgba(0,220,255,.25); } .c3 { --card-glow:rgba(43,107,255,.45); } .c4 { --card-glow:rgba(44,130,255,.30); } .c5 { --card-glow:rgba(78,210,255,.28); }
      .dock-card[data-url] .dock-card__hint::after { content:' ↗'; color:var(--cyan); }
      .coming-soon { position:fixed; z-index:20; inset:0; display:grid; place-items:center; padding:24px; visibility:hidden; opacity:0; background:rgba(0,4,14,.77); backdrop-filter:blur(14px); transition:opacity .3s ease,visibility .3s ease; }
      .coming-soon.is-open { visibility:visible; opacity:1; }
      .coming-soon__panel { position:relative; width:min(900px,100%); height:min(72svh,640px); min-height:420px; overflow:hidden; border:1px solid rgba(135,215,255,.46); border-radius:22px; background:#020817; box-shadow:0 28px 70px rgba(0,2,15,.66),0 0 55px rgba(0,110,255,.16),inset 0 1px 0 rgba(223,249,255,.18); transform:translateY(15px) scale(.97); transition:transform .34s cubic-bezier(.2,.8,.2,1); }
      .coming-soon.is-open .coming-soon__panel { transform:translateY(0) scale(1); }
      .three-d-paper-frame { display:block; width:100%; height:100%; border:0; background:#020817; }
      .coming-soon__context { position:absolute; z-index:2; left:clamp(19px,4vw,42px); top:clamp(19px,3vw,30px); max-width:215px; pointer-events:none; text-transform:uppercase; }
      .coming-soon__context span { display:block; color:#27d5ff; font:500 10px/1.3 'DM Mono',monospace; letter-spacing:.14em; }
      .coming-soon__context strong { display:block; margin-top:8px; color:#f3fbff; font:500 clamp(17px,2vw,25px)/1.05 'Outfit','Noto Sans SC',sans-serif; letter-spacing:-.05em; }
      .coming-soon__context p { margin:7px 0 0; color:rgba(205,235,255,.70); font-size:11px; line-height:1.55; }
      .coming-soon__close { position:absolute; right:17px; top:17px; z-index:2; display:grid; width:34px; height:34px; place-items:center; border:1px solid rgba(184,232,255,.48); border-radius:50%; color:#fff; background:rgba(2,10,30,.54); backdrop-filter:blur(8px); cursor:pointer; font:300 26px/1 'Outfit',sans-serif; transition:background .2s ease,transform .2s ease; }
      .coming-soon__close:hover,.coming-soon__close:focus-visible { background:rgba(255,255,255,.15); transform:rotate(90deg); outline:0; }
      @keyframes float { 0%,100% { transform:translate3d(0,0,0) rotateZ(0); } 50% { transform:translate3d(0,-17px,18px) rotateZ(1.4deg); } }
      @keyframes sweep { 0%,20% { transform:translateX(-25%) rotate(21deg); opacity:0; } 35% { opacity:.72; } 58%,100% { transform:translateX(160%) rotate(21deg); opacity:0; } }
      @media (max-width:760px) { body { overflow:auto; } .site { min-height:100svh; overflow:hidden; } .nav { height:70px; padding:0 22px; } .brand { font-size:24px; } .nav__state { font-size:8px; } .hero { height:calc(100svh - 70px); min-height:620px; padding:0 0 20px; } .core-stage { min-height:310px; } .core-stage::before { width:86vw; } .core-stage::after { width:72vw; } .core-float { width:166px; } .core-caption { top:calc(50% + 108px); font-size:8px; } .dock { display:flex; width:calc(100% - 32px); min-height:209px; padding:0; overflow-x:auto; overflow-y:visible; border-radius:21px; scroll-snap-type:x mandatory; scrollbar-width:none; } .dock::-webkit-scrollbar { display:none; } .dock-card { flex:0 0 172px; min-height:194px; padding:20px; scroll-snap-align:center; } .dock-card h2 { font-size:20px; } .dock-card__number { right:16px; top:17px; font-size:31px; } .dock-card:hover,.dock-card:focus-visible,.dock-card.is-active { transform:translateY(-10px); } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; transition-duration:.01ms!important; } }
    </style>
  </head>
  <body>
    <div class="site" id="top">
      <header class="nav">
        <a class="brand" href="#top" aria-label="TBN 实验室首页">TBN <span>LAB</span><i></i></a>
        <span class="nav__state">LABORATORY / 01—05</span>
      </header>
      <main class="hero">
        <section class="core-stage" aria-label="TBN 实验室核心">
          <div class="core-float" aria-hidden="true"><div class="lab-core"><span class="core-glyph">TBN</span></div></div>
          <span class="core-caption"><b>●</b>&nbsp;&nbsp; SELECT A DIRECTION</span>
        </section>
        <section class="dock" aria-label="TBN 实验方向，选择一项进入">
          <button class="dock-card c1" data-title="夜场与酒吧" data-copy="从产品、运营到推广，回到真实的门店现场，解决真正影响体验的每一个环节。"><span class="dock-card__number">01</span><span class="dock-card__eyebrow">Nightlife</span><h2>夜场与酒吧</h2><p>Nightlife &amp; Bar</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
          <button class="dock-card c2" data-url="artists/index.html" data-title="艺人与演出" data-copy="不把舞台当成名单。让合适的人、内容与场地在同一个晚上形成真正的化学反应。"><span class="dock-card__number">02</span><span class="dock-card__eyebrow">Live sets</span><h2>艺人与演出</h2><p>Artists &amp; Live</p><span class="dock-card__hint">TBN ARTISTS</span></button>
          <button class="dock-card c3" data-title="空间与体验" data-copy="研究动线、情绪和每一次停留。好的空间会自然把人留住，不需要大声解释自己。"><span class="dock-card__number">03</span><span class="dock-card__eyebrow">Spatial</span><h2>空间与体验</h2><p>Space &amp; Experience</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
          <button class="dock-card c4" data-title="商业策划" data-copy="让定位、内容与执行在一条线上。每个方案都从现实条件出发，才有持续发生的机会。"><span class="dock-card__number">04</span><span class="dock-card__eyebrow">Planning</span><h2>商业策划</h2><p>Business Planning</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
          <button class="dock-card c5" data-title="发起人与伙伴" data-copy="TBN 实验室相信长期的合作不只是交换资源，而是一起把有价值的事做得更完整。"><span class="dock-card__number">05</span><span class="dock-card__eyebrow">People</span><h2>发起人与伙伴</h2><p>People &amp; Partners</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
        </section>
      </main>
    </div>
    <div class="coming-soon" id="coming-soon" role="dialog" aria-modal="true" aria-label="建站中，ThreeDPaper 交互展示" aria-hidden="true">
      <div class="coming-soon__panel"><div class="coming-soon__context"><span id="coming-soon-kicker">TBN LAB / 01</span><strong id="coming-soon-title">夜场与酒吧</strong><p>正在建设，敬请期待。</p></div><button class="coming-soon__close" type="button" aria-label="关闭提示">×</button><iframe class="three-d-paper-frame" title="TBN LAB — Coming Soon" src="threeui/3d-paper/sources/tbn-coming-soon-blue.html" sandbox="allow-scripts" loading="eager"></iframe></div>
    </div>
    <script>
      const cards=[...document.querySelectorAll('.dock-card')];
      const modal=document.querySelector('#coming-soon');
      const close=document.querySelector('.coming-soon__close');
      const comingSoonKicker=document.querySelector('#coming-soon-kicker');
      const comingSoonTitle=document.querySelector('#coming-soon-title');
      const root=document.documentElement;
      let previousFocus;
      const select=card=>cards.forEach(item=>item.classList.toggle('is-active',item===card));
      const openModal=card=>{ select(card); previousFocus=card; comingSoonKicker.textContent='TBN LAB / '+card.querySelector('.dock-card__number').textContent; comingSoonTitle.textContent=card.dataset.title; modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); close.focus(); };
      const closeModal=()=>{ modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true'); previousFocus?.focus(); };
      cards.forEach(card=>{ card.addEventListener('click',()=>{ if(card.dataset.url){ window.location.assign(card.dataset.url); return; } openModal(card); }); card.addEventListener('focus',()=>select(card)); });
      window.addEventListener('pointermove',event=>{ if(event.pointerType!=='mouse') return; root.style.setProperty('--mx',((event.clientX/window.innerWidth)-.5).toFixed(3)); root.style.setProperty('--my',((event.clientY/window.innerHeight)-.5).toFixed(3)); },{passive:true});
      close.addEventListener('click',closeModal);
      modal.addEventListener('click',event=>{ if(event.target===modal) closeModal(); });
      document.addEventListener('keydown',event=>{ if(event.key==='Escape'&&modal.classList.contains('is-open')) closeModal(); });
    </script>
  </body>
</html>
