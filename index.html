<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020817" />
    <meta name="description" content="TBN 实验室 — 让一场相遇，被看见，被记住。" />
    <title>TBN 实验室</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23020817'/%3E%3Cpath d='M16 18h32v7H36v23h-8V25H16z' fill='%23f3fbff'/%3E%3Ccircle cx='49' cy='45' r='5' fill='%2324cfff'/%3E%3C/svg%3E" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap');

      :root { --ink:#020817; --paper:#f3fbff; --muted:#8ea4bf; --blue:#087dff; --cyan:#24cfff; --line:rgba(133,209,255,.24); }
      * { box-sizing:border-box; }
      html { background:var(--ink); scroll-behavior:smooth; }
      body { margin:0; min-width:320px; color:var(--paper); background:radial-gradient(circle at 10% 6%,rgba(0,121,255,.35),transparent 27%),radial-gradient(circle at 86% 54%,rgba(20,199,255,.12),transparent 28%),radial-gradient(circle at 50% 78%,rgba(0,75,208,.20),transparent 34%),var(--ink); font-family:'Noto Sans SC',sans-serif; overflow-x:hidden; }
      body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:20; opacity:.28; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E"); mix-blend-mode:soft-light; }
      a { color:inherit; text-decoration:none; }
      .site { min-height:100vh; position:relative; isolation:isolate; }
      .ambient { position:absolute; width:52vw; max-width:840px; aspect-ratio:1; border-radius:50%; filter:blur(44px); opacity:.48; pointer-events:none; z-index:-1; background:radial-gradient(circle,rgba(0,137,255,.48),rgba(0,51,163,.20) 41%,transparent 68%); left:50%; bottom:-13rem; transform:translateX(-50%); }
      .nav { height:92px; display:flex; align-items:center; padding:0 clamp(24px,5.2vw,88px); font-family:'Outfit',sans-serif; font-size:14px; }
      .brand { letter-spacing:-.06em; display:flex; align-items:center; gap:.28em; font-size:28px; font-weight:600; }
      .brand span { color:var(--cyan); font-weight:400; }
      .brand-dot { margin-top:14px; width:5px; height:5px; border-radius:50%; background:var(--blue); box-shadow:0 0 14px var(--cyan); }
      .hero { min-height:calc(100vh - 92px); display:flex; flex-direction:column; padding:0 clamp(24px,5.2vw,88px); }
      .stage { position:relative; flex:1; min-height:440px; width:min(1120px,100%); margin:0 auto; perspective:1800px; display:flex; align-items:center; justify-content:center; padding:0 30px; }
      .stage::after { content:''; position:absolute; left:7%; right:7%; top:calc(50% + 96px); height:112px; background:radial-gradient(ellipse at center,rgba(0,125,255,.48),rgba(0,55,171,.19) 41%,transparent 70%); filter:blur(20px); transform:rotateX(67deg); pointer-events:none; }
      .card { --r:0deg; --ty:0px; --tx:0px; --base-y:0px; appearance:none; font:inherit; text-align:left; color:inherit; border:1px solid rgba(155,219,255,.32); position:absolute; width:clamp(182px,19.3vw,258px); height:clamp(246px,25.3vw,336px); padding:clamp(18px,2vw,28px); overflow:hidden; cursor:pointer; border-radius:20px; background:linear-gradient(130deg,rgba(235,250,255,.17),rgba(0,132,255,.19) 42%,rgba(3,15,45,.78)); box-shadow:inset 1px 1px 0 rgba(255,255,255,.22), inset -1px -1px 0 rgba(0,66,172,.46), 0 24px 48px rgba(0,0,0,.33); backdrop-filter:blur(12px); transform:translate3d(var(--tx),calc(var(--base-y) + var(--ty)),0) rotate(var(--r)); transform-origin:center bottom; transition:transform .48s cubic-bezier(.2,.8,.2,1), border-color .35s ease, box-shadow .48s ease, filter .35s ease; }
      .card::before { content:''; position:absolute; inset:0; background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 28% 72%,rgba(44,203,255,.24)); opacity:.72; pointer-events:none; }
      .card::after { content:''; width:110px; height:110px; border-radius:50%; position:absolute; right:-58px; top:-44px; background:var(--glow); filter:blur(22px); opacity:.67; pointer-events:none; }
      .card:hover,.card:focus-visible,.card.is-active { --ty:-42px; border-color:rgba(205,244,255,.8); box-shadow:inset 1px 1px 0 rgba(255,255,255,.36), inset -1px -1px 0 rgba(0,110,225,.48), 0 44px 70px rgba(0,4,22,.62), 0 0 34px var(--glow); z-index:12!important; filter:brightness(1.16); outline:0; }
      .card:hover { transform:translate3d(var(--tx),calc(var(--base-y) + var(--ty)),0) rotate(0deg) scale(1.04); }
      .card:focus-visible { outline:2px solid #c7f3ff; outline-offset:5px; }
      .card__index { position:absolute; right:20px; bottom:16px; font:400 clamp(30px,3vw,48px)/1 'Outfit',sans-serif; letter-spacing:-.08em; color:#a9e8ff; }
      .card__sup { display:block; position:relative; z-index:1; color:#c9ecff; font:500 10px/1.3 'DM Mono',monospace; letter-spacing:.13em; text-transform:uppercase; }
      .card h2 { position:relative; z-index:1; margin:17px 0 5px; font-size:clamp(21px,2vw,29px); font-weight:600; letter-spacing:-.06em; line-height:1.2; }
      .card p { position:relative; z-index:1; max-width:160px; margin:0; font:400 12px/1.55 'Outfit',sans-serif; color:#bcd7ed; }
      .card__mark { position:absolute; left:20px; bottom:21px; width:24px; height:48px; border-left:2px solid var(--cyan); border-right:2px solid var(--cyan); opacity:.9; }
      .card__mark::after { content:''; position:absolute; left:8px; top:0; width:2px; height:48px; background:var(--cyan); }
      .c1 { --r:-9deg; --tx:-372px; --base-y:46px; --glow:rgba(0,119,255,.48); z-index:5; }
      .c2 { --r:-5deg; --tx:-186px; --base-y:22px; --glow:rgba(0,202,255,.52); z-index:4; }
      .c3 { --r:0deg; --tx:0px; --base-y:0px; --glow:rgba(18,132,255,.49); z-index:3; }
      .c4 { --r:5deg; --tx:186px; --base-y:-25px; --glow:rgba(0,86,220,.54); z-index:2; }
      .c5 { --r:9deg; --tx:372px; --base-y:-48px; --glow:rgba(22,193,255,.47); z-index:1; }
      .card__info { position:absolute; left:20px; right:20px; bottom:19px; height:50px; z-index:2; opacity:0; transform:translateY(10px); transition:opacity .25s ease,transform .3s ease; pointer-events:none; font-size:11px; color:#e8f8ff; line-height:1.55; }
      .card:hover .card__info,.card:focus-visible .card__info,.card.is-active .card__info { opacity:1; transform:translateY(0); }
      .card:hover .card__mark,.card:focus-visible .card__mark,.card.is-active .card__mark { opacity:0; }
      .coming-soon { opacity:0; visibility:hidden; position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:24px; background:rgba(1,7,20,.74); backdrop-filter:blur(12px); transition:opacity .3s ease,visibility .3s ease; }
      .coming-soon.is-open { opacity:1; visibility:visible; }
      .coming-soon__panel { position:relative; width:min(900px,100%); height:min(72svh,640px); min-height:420px; overflow:hidden; border:1px solid rgba(135,215,255,.46); border-radius:22px; background:#020817; box-shadow:0 28px 70px rgba(0,2,15,.66),0 0 55px rgba(0,110,255,.16),inset 0 1px 0 rgba(223,249,255,.18); transform:translateY(15px) scale(.97); transition:transform .34s cubic-bezier(.2,.8,.2,1); }
      .coming-soon.is-open .coming-soon__panel { transform:translateY(0) scale(1); }
      .three-d-paper-frame { display:block; width:100%; height:100%; border:0; background:#020817; }
      .coming-soon__context { position:absolute; z-index:2; left:clamp(19px,4vw,42px); top:clamp(19px,3vw,30px); max-width:215px; pointer-events:none; text-transform:uppercase; }
      .coming-soon__context span { display:block; color:#27d5ff; font:500 10px/1.3 'DM Mono',monospace; letter-spacing:.14em; }
      .coming-soon__context strong { display:block; margin-top:8px; color:#f3fbff; font:500 clamp(17px,2vw,25px)/1.05 'Outfit',sans-serif; letter-spacing:-.05em; }
      .coming-soon__context p { margin:7px 0 0; color:rgba(205,235,255,.70); font-size:11px; line-height:1.55; }
      .coming-soon__close { position:absolute; right:17px; top:17px; z-index:2; display:grid; place-items:center; width:34px; height:34px; border:1px solid rgba(184,232,255,.48); border-radius:50%; color:#fff; background:rgba(2,10,30,.54); backdrop-filter:blur(8px); font:300 26px/1 'Outfit',sans-serif; cursor:pointer; transition:background .2s ease,transform .2s ease; }
      .coming-soon__close:hover,.coming-soon__close:focus-visible { background:rgba(255,255,255,.15); transform:rotate(90deg); outline:0; }
      @media (max-width:760px) { .nav { height:75px; padding:0 21px; } .brand { font-size:23px; } .hero { min-height:calc(100svh - 75px); padding:0 20px; } .stage { min-height:325px; width:calc(100% + 40px); margin:0 -20px; padding:0 20px; overflow-x:auto; justify-content:flex-start; align-items:center; gap:14px; scroll-snap-type:x mandatory; scrollbar-width:none; } .stage::-webkit-scrollbar { display:none; } .stage::after { left:0; right:0; top:calc(50% + 62px); height:74px; } .card { position:relative; flex:0 0 174px; width:174px; height:231px; padding:17px; border-radius:17px; scroll-snap-align:center; } .card h2 { font-size:20px; margin-top:14px; } .card p { font-size:11px; } .card__index { font-size:33px; right:15px; } .c1,.c2,.c3,.c4,.c5 { --r:0deg; --tx:0px; --base-y:0px; z-index:auto; } .card:hover,.card:focus-visible,.card.is-active { --ty:-15px; } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; transition-duration:.01ms!important; } }
    </style>
  </head>
  <body>
    <main class="site">
      <div class="ambient"></div>
      <header class="nav">
        <a class="brand" href="#top" aria-label="TBN 实验室首页">TBN <span>LAB</span><i class="brand-dot"></i></a>
      </header>
      <section class="hero" id="top" aria-label="TBN 实验方向">
        <div class="stage" id="lab" aria-label="TBN 实验方向，悬停或点击卡片了解更多">
          <button class="card c1" data-title="夜场与酒吧" data-copy="从产品、运营到推广，回到真实的门店现场，解决真正影响体验的每一个环节。"><span class="card__sup">01 / nightlife</span><h2>夜场与酒吧</h2><p>Nightlife &amp; Bar</p><span class="card__mark"></span><span class="card__info">让现场更有记忆点，也更经得起日常运营。</span><span class="card__index">01</span></button>
          <button class="card c2" data-url="artists/index.html" data-title="艺人与演出" data-copy="不把舞台当成名单。让合适的人、内容与场地在同一个晚上形成真正的化学反应。"><span class="card__sup">02 / live sets</span><h2>艺人与演出</h2><p>Artists &amp; Live</p><span class="card__mark"></span><span class="card__info">进入 TBN ARTISTS 网站 ↗</span><span class="card__index">02</span></button>
          <button class="card c3" data-title="空间与体验" data-copy="研究动线、情绪和每一次停留。好的空间会自然把人留住，不需要大声解释自己。"><span class="card__sup">03 / spatial</span><h2>空间与体验</h2><p>Space &amp; Experience</p><span class="card__mark"></span><span class="card__info">让抵达、停留与离开都有理由。</span><span class="card__index">03</span></button>
          <button class="card c4" data-title="商业策划" data-copy="让定位、内容与执行在一条线上。每个方案都从现实条件出发，才有持续发生的机会。"><span class="card__sup">04 / planning</span><h2>商业策划</h2><p>Business Planning</p><span class="card__mark"></span><span class="card__info">不只提出方向，也考虑怎样落在今天。</span><span class="card__index">04</span></button>
          <button class="card c5" data-title="发起人与伙伴" data-copy="TBN 实验室相信长期的合作不只是交换资源，而是一起把有价值的事做得更完整。"><span class="card__sup">05 / people</span><h2>发起人与伙伴</h2><p>People &amp; Partners</p><span class="card__mark"></span><span class="card__info">为同一件值得做的事，找到彼此。</span><span class="card__index">05</span></button>
        </div>
      </section>
    </main>
    <div class="coming-soon" id="coming-soon" role="dialog" aria-modal="true" aria-label="建站中，ThreeDPaper 交互展示" aria-hidden="true">
      <div class="coming-soon__panel"><div class="coming-soon__context"><span id="coming-soon-kicker">TBN LAB / 01</span><strong id="coming-soon-title">夜场与酒吧</strong><p>正在建设，敬请期待。</p></div><button class="coming-soon__close" type="button" aria-label="关闭提示">×</button><iframe class="three-d-paper-frame" title="TBN LAB — Coming Soon" src="threeui/3d-paper/sources/tbn-coming-soon-blue.html" sandbox="allow-scripts" loading="eager"></iframe></div>
    </div>
    <script>
      const cards=[...document.querySelectorAll('.card')]; const modal=document.querySelector('#coming-soon'); const close=document.querySelector('.coming-soon__close'); const comingSoonKicker=document.querySelector('#coming-soon-kicker'); const comingSoonTitle=document.querySelector('#coming-soon-title'); let previousFocus;
      const select=card=>{ cards.forEach(item=>item.classList.remove('is-active')); card.classList.add('is-active'); };
      const openModal=card=>{ select(card); previousFocus=card; comingSoonKicker.textContent=`TBN LAB / ${card.querySelector('.card__index').textContent}`; comingSoonTitle.textContent=card.dataset.title; modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); close.focus(); };
      const closeModal=()=>{ modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true'); previousFocus?.focus(); };
      cards.forEach(card=>{ card.addEventListener('click',()=>{ if(card.dataset.url) { window.location.assign(card.dataset.url); return; } openModal(card); }); card.addEventListener('focus',()=>select(card)); }); close.addEventListener('click',closeModal); modal.addEventListener('click',event=>{ if(event.target===modal) closeModal(); }); document.addEventListener('keydown',event=>{ if(event.key==='Escape'&&modal.classList.contains('is-open')) closeModal(); });
    </script>
  </body>
</html>
