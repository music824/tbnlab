  <body>
    <div class="intro" id="intro" aria-hidden="true"><span class="intro__wash"></span><span class="intro__word">TBN</span></div>
    <div class="site" id="top">
      <header class="nav">
        <a class="brand" href="#top" aria-label="TBN 实验室首页">TBN <span>LAB</span><i></i></a>
        <span class="nav__state">LABORATORY / 01—05</span>
      </header>
      <main class="hero">
        <section class="core-stage" aria-label="TBN 实验室核心">
          <div class="core-float" aria-hidden="true"><div class="lab-core"><span class="core-glyph">TBN</span></div></div>
          <span class="core-link" aria-hidden="true"></span>
          <span class="core-caption"><b>●</b>&nbsp;&nbsp; SELECT A DIRECTION</span>
        </section>
        <section class="dock" aria-label="TBN 实验方向，选择一项进入">
          <button class="dock-card c1" data-title="夜场与酒吧" data-copy="从产品、运营到推广，回到真实的门店现场，解决真正影响体验的每一个环节。"><span class="dock-card__number">01</span><span class="dock-card__eyebrow">Nightlife</span><h2>夜场与酒吧</h2><p>Nightlife &amp; Bar</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
          <button class="dock-card c2" data-url="artists/index.html" data-title="艺人与演出" data-copy="不把舞台当成名单。让合适的人、内容与场地在同一个晚上形成真正的化学反应。"><span class="dock-card__number">02</span><span class="dock-card__eyebrow">Live sets</span><h2>艺人与演出</h2><p>Artists &amp; Live</p><span class="dock-card__hint">TBN ARTISTS</span></button>
          <button class="dock-card c3" data-title="空间与体验" data-copy="研究动线、情绪和每一次停留。好的空间会自然把人留住，不需要大声解释自己。"><span class="dock-card__number">03</span><span class="dock-card__eyebrow">Spatial</span><h2>空间与体验</h2><p>Space &amp; Experience</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
          <button class="dock-card c4" data-title="商业策划" data-copy="让定位、内容与执行在一条线上。每个方案都从现实条件出发，才有持续发生的机会。"><span class="dock-card__number">04</span><span class="dock-card__eyebrow">Planning</span><h2>商业策划</h2><p>Business Planning</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
          <button class="dock-card c5" data-title="发起人与伙伴" data-copy="TBN 实验室相信长期的合作不只是交换资源，而是一起把有价值的事做得更完整。"><span class="dock-card__number">05</span><span class="dock-card__eyebrow">People</span><h2>发起人与伙伴</h2><p>People &amp; Partners</p><span class="dock-card__hint">OPEN DIRECTION</span></button>
        </section>
      </main>
    </div>
    <div class="coming-soon" id="coming-soon" role="dialog" aria-modal="true" aria-label="建站中，ThreeDPaper 交互展示" aria-hidden="true">
      <div class="coming-soon__panel"><div class="coming-soon__context"><span id="coming-soon-kicker">TBN LAB / 01</span><strong id="coming-soon-title">夜场与酒吧</strong><p>正在建设，敬请期待。</p></div><button class="coming-soon__close" type="button" aria-label="关闭提示">×</button><iframe class="three-d-paper-frame" title="TBN LAB — Coming Soon" src="threeui/3d-paper/sources/tbn-coming-soon-blue.html" sandbox="allow-scripts" loading="eager"></iframe></div>
    </div>
    <script>
      const cards=[...document.querySelectorAll('.dock-card')];
      const modal=document.querySelector('#coming-soon');
      const close=document.querySelector('.coming-soon__close');
      const comingSoonKicker=document.querySelector('#coming-soon-kicker');
      const comingSoonTitle=document.querySelector('#coming-soon-title');
      const root=document.documentElement;
      const site=document.querySelector('.site');
      const intro=document.querySelector('#intro');
      let previousFocus;
      const navigation=performance.getEntriesByType('navigation')[0];
      const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let hasSeenIntro=false;
      try { hasSeenIntro=sessionStorage.getItem('tbn-lab-home-intro')==='seen'; } catch (_) {}
      const playIntro=!reducedMotion&&(navigation?.type==='reload'||!hasSeenIntro);
      const runIntro=()=>{
        document.body.classList.add('intro-pending');
        try { sessionStorage.setItem('tbn-lab-home-intro','seen'); } catch (_) {}
        window.requestAnimationFrame(()=>intro.classList.add('is-ready'));
        window.setTimeout(()=>{
          const target=document.querySelector('.core-glyph').getBoundingClientRect();
          intro.style.setProperty('--intro-x',`${target.left+target.width/2-window.innerWidth/2}px`);
          intro.style.setProperty('--intro-y',`${target.top+target.height/2-window.innerHeight/2}px`);
          intro.style.setProperty('--intro-scale',window.innerWidth<760?'.42':'.16');
          site.classList.add('intro-forming');
          intro.classList.add('is-travelling');
        },1150);
        window.setTimeout(()=>{
          intro.classList.add('is-lighting');
        },2200);
        window.setTimeout(()=>{
          site.classList.add('intro-lit');
          document.body.classList.remove('intro-pending');
        },2540);
        window.setTimeout(()=>intro.classList.add('is-exiting'),3350);
        window.setTimeout(()=>intro.remove(),3950);
      };
      if(playIntro) runIntro(); else intro.remove();
      const select=card=>{
        cards.forEach(item=>item.classList.toggle('is-active',item===card));
        site.classList.add('has-selection');
        const styles=getComputedStyle(card);
        root.style.setProperty('--core-aim',styles.getPropertyValue('--core-aim').trim());
        root.style.setProperty('--core-roll',styles.getPropertyValue('--core-roll').trim());
        root.style.setProperty('--beam-angle',styles.getPropertyValue('--beam-angle').trim());
        root.style.setProperty('--active-glow',styles.getPropertyValue('--card-glow').trim());
      };
      const openModal=card=>{ select(card); previousFocus=card; comingSoonKicker.textContent='TBN LAB / '+card.querySelector('.dock-card__number').textContent; comingSoonTitle.textContent=card.dataset.title; modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); close.focus(); };
      const closeModal=()=>{ modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true'); previousFocus?.focus(); };
      cards.forEach(card=>{ card.addEventListener('click',()=>{ if(card.dataset.url){ window.location.assign(card.dataset.url); return; } openModal(card); }); card.addEventListener('focus',()=>select(card)); });
      window.addEventListener('pointermove',event=>{ if(event.pointerType!=='mouse') return; root.style.setProperty('--mx',((event.clientX/window.innerWidth)-.5).toFixed(3)); root.style.setProperty('--my',((event.clientY/window.innerHeight)-.5).toFixed(3)); },{passive:true});
      close.addEventListener('click',closeModal);
      modal.addEventListener('click',event=>{ if(event.target===modal) closeModal(); });
      document.addEventListener('keydown',event=>{ if(event.key==='Escape'&&modal.classList.contains('is-open')) closeModal(); });
    </script>
  </body>
</html>
