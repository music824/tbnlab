<!doctype html>
<html lang="zh-CN">

    <title>TBN LAB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root { --ink:#edf5ff; --muted:rgba(218,231,255,.62); --violet:#4074ff; --violet-soft:#a9c1ff; --void:#030609; }

      body { overflow:hidden; font-family:'Manrope','Noto Sans SC',sans-serif; -webkit-font-smoothing:antialiased; }
      button,a { color:inherit; font:inherit; }
      button { border:0; }
      .site { position:relative; min-height:100svh; overflow:hidden; isolation:isolate; background:radial-gradient(ellipse 57% 54% at 50% 52%,rgba(25,83,202,.16),transparent 59%),radial-gradient(ellipse 45% 42% at 17% 76%,rgba(35,92,191,.1),transparent 74%),#030609; }
      .site::before { position:absolute; z-index:-2; inset:-12%; content:''; opacity:.74; background:radial-gradient(ellipse 32% 42% at 50% 50%,rgba(57,120,255,.2),transparent 68%),radial-gradient(ellipse 31% 27% at 56% 67%,rgba(18,72,178,.12),transparent 72%); filter:blur(26px); pointer-events:none; }
      .site::after { position:absolute; z-index:8; inset:0; content:''; opacity:.1; pointer-events:none; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E"); mix-blend-mode:soft-light; }
      .nav { position:relative; z-index:12; display:flex; align-items:center; justify-content:space-between; height:82px; padding:0 clamp(25px,5.3vw,84px); }
      .brand { display:inline-flex; align-items:baseline; gap:.16em; color:#f7f5ff; font-size:clamp(22px,2vw,29px); font-weight:700; letter-spacing:-.09em; text-decoration:none; }
      .brand span { color:#69a9ff; }
      .brand i { width:6px; height:6px; margin-left:.12em; border-radius:50%; background:#76b1ff; box-shadow:0 0 13px rgba(97,165,255,.72); }
      .nav__links { display:flex; align-items:center; gap:clamp(19px,3vw,46px); }
      .nav__links button { padding:8px 0; color:rgba(239,233,255,.68); background:transparent; cursor:pointer; font:500 10px/1 'DM Mono',monospace; letter-spacing:.18em; transition:color .45s ease,text-shadow .45s ease; }
      .nav__links button:hover,.nav__links button:focus-visible { color:#f7fbff; outline:0; text-shadow:0 0 15px rgba(112,176,255,.52); }
      .stage { position:relative; z-index:1; display:grid; min-height:calc(100svh - 82px); place-items:center; perspective:1500px; perspective-origin:50% 46%; touch-action:none; user-select:none; }
      .stage__halo { position:absolute; left:50%; top:50%; width:min(76vw,1020px); aspect-ratio:1.65; border-radius:50%; opacity:.88; background:radial-gradient(ellipse,rgba(57,119,255,.22),rgba(21,73,171,.08) 34%,transparent 68%); filter:blur(35px); transform:translate(-50%,-47%); pointer-events:none; }
      .stage__floor { position:absolute; left:50%; top:64%; width:min(76vw,1120px); height:190px; border-radius:50%; opacity:.74; background:radial-gradient(ellipse,rgba(46,105,237,.21),rgba(15,44,112,.1) 35%,transparent 71%); filter:blur(25px); transform:translateX(-50%) rotateX(69deg); pointer-events:none; }
      .deck { position:relative; width:min(1040px,94vw); height:min(510px,65vh); transform-style:preserve-3d; will-change:transform; }
      .card { position:absolute; left:50%; top:50%; display:flex; width:clamp(218px,24vw,318px); height:clamp(260px,28vw,370px); flex-direction:column; justify-content:space-between; padding:clamp(22px,2.2vw,31px); overflow:hidden; border:1px solid rgba(186,215,255,.5); border-radius:27px; color:var(--ink); background:linear-gradient(137deg,rgba(164,201,255,.29) 0%,rgba(55,112,239,.36) 31%,rgba(11,47,112,.54) 69%,rgba(3,8,18,.72) 100%); box-shadow:inset 1px 1px 0 rgba(255,255,255,.36),inset -1px -1px 0 rgba(37,89,190,.55),inset 18px 17px 47px rgba(208,229,255,.05),inset -24px -24px 46px rgba(2,7,18,.38),0 24px 52px rgba(0,0,0,.42),0 0 35px rgba(47,112,244,.13); backdrop-filter:blur(10px) saturate(1.05); cursor:grab; text-align:left; transform-style:preserve-3d; will-change:transform,opacity; transition:filter .55s ease,border-color .5s ease,box-shadow .5s ease; }
      .card::before { position:absolute; inset:0; content:''; opacity:.88; background:linear-gradient(124deg,rgba(255,255,255,.42),transparent 17% 54%,rgba(139,190,255,.16) 77%,rgba(255,255,255,.06)),radial-gradient(ellipse at 19% 1%,rgba(237,247,255,.22),transparent 27%),radial-gradient(ellipse at 100% 100%,rgba(28,88,205,.34),transparent 62%); pointer-events:none; }
      .card::after { position:absolute; top:-26%; left:-32%; width:28%; height:160%; content:''; opacity:.22; background:linear-gradient(90deg,transparent,rgba(245,238,255,.8),transparent); filter:blur(2px); transform:rotate(18deg); pointer-events:none; }
      .card:active { cursor:grabbing; }
      .card__top,.card__copy { position:relative; z-index:1; transform:translateZ(18px); }
      .card__number { display:block; color:rgba(228,240,255,.82); font:400 clamp(44px,5.2vw,70px)/.9 'Manrope',sans-serif; letter-spacing:-.11em; text-shadow:0 0 18px rgba(144,191,255,.22); }
      .card__rule { display:block; width:25px; height:1px; margin-top:18px; background:rgba(197,221,255,.56); }
      .card h2 { margin:0 0 8px; color:#f3f8ff; font-size:clamp(20px,2.1vw,30px); font-weight:600; letter-spacing:-.07em; line-height:1.12; text-shadow:0 2px 12px rgba(2,15,48,.68); }
      .card p { margin:0; color:rgba(218,234,255,.78); font:500 9px/1.35 'DM Mono',monospace; letter-spacing:.12em; }
      .card.is-focused { border-color:rgba(210,230,255,.84); box-shadow:inset 1px 1px 0 rgba(255,255,255,.65),inset -1px -1px 0 rgba(67,123,246,.62),inset 18px 17px 47px rgba(220,237,255,.12),inset -24px -24px 46px rgba(2,7,20,.32),0 30px 70px rgba(0,0,0,.45),0 0 48px rgba(58,128,255,.36); }
      .card.is-anchor { border-color:rgba(206,228,255,.76); box-shadow:inset 1px 1px 0 rgba(255,255,255,.58),inset -1px -1px 0 rgba(61,119,240,.6),inset 18px 17px 47px rgba(221,239,255,.12),inset -24px -24px 46px rgba(1,7,19,.3),0 30px 74px rgba(0,0,0,.47),0 0 58px rgba(50,120,255,.31); }
      .card.is-muted { filter:brightness(.7) blur(.55px); }
      .card.is-focused::after { opacity:.58; animation:glint 2.4s ease-in-out infinite; }
      .card.is-entering { pointer-events:none; }
      .stage__note { position:absolute; bottom:clamp(21px,3vh,35px); left:50%; z-index:4; margin:0; color:rgba(210,228,255,.4); font:500 8px/1 'DM Mono',monospace; letter-spacing:.22em; transform:translateX(-50%); white-space:nowrap; pointer-events:none; }
      .coming-soon { position:fixed; z-index:30; inset:0; display:grid; visibility:hidden; place-items:center; padding:24px; opacity:0; background:rgba(4,3,8,.77); backdrop-filter:blur(16px); transition:opacity .45s ease,visibility .45s ease; }
      .coming-soon.is-open { visibility:visible; opacity:1; }
      .coming-soon__panel { position:relative; width:min(900px,100%); height:min(72svh,640px); min-height:410px; overflow:hidden; border:1px solid rgba(165,204,255,.5); border-radius:24px; background:#050b16; box-shadow:0 30px 85px rgba(0,0,0,.68),0 0 70px rgba(46,113,238,.24),inset 0 1px 0 rgba(235,246,255,.18); }
      .three-d-paper-frame { display:block; width:100%; height:100%; border:0; background:#07050c; }
      .coming-soon__context { position:absolute; z-index:2; top:clamp(18px,3vw,30px); left:clamp(20px,4vw,42px); max-width:220px; pointer-events:none; }
      .coming-soon:not(.is-about) .coming-soon__context { display:none; }
      .coming-soon__context span { display:block; color:#9fc9ff; font:500 9px/1.3 'DM Mono',monospace; letter-spacing:.16em; }
      .coming-soon__context strong { display:block; margin-top:8px; color:#f3f8ff; font:600 clamp(18px,2vw,26px)/1.08 'Manrope','Noto Sans SC',sans-serif; letter-spacing:-.05em; }
      .coming-soon__context p { margin:7px 0 0; color:rgba(220,234,255,.74); font-size:11px; line-height:1.55; }
      .coming-soon__close { position:absolute; top:16px; right:16px; z-index:2; display:grid; width:34px; height:34px; place-items:center; border:1px solid rgba(187,215,255,.5); border-radius:50%; color:#fff; background:rgba(5,14,31,.58); cursor:pointer; font:300 25px/1 'Manrope',sans-serif; backdrop-filter:blur(9px); transition:background .35s ease,transform .45s cubic-bezier(.16,.84,.2,1); }
      .coming-soon__close:hover,.coming-soon__close:focus-visible { outline:0; background:rgba(94,153,255,.22); transform:rotate(90deg); }
      @keyframes glint { 0%,60%,100% { transform:translateX(0) rotate(18deg); } 76% { transform:translateX(530%) rotate(18deg); } }
      @media (max-width:760px) { .nav { height:70px; padding:0 20px; } .brand { font-size:24px; } .nav__links { gap:17px; } .nav__links button { font-size:8px; letter-spacing:.12em; } .stage { min-height:calc(100svh - 70px); perspective:960px; perspective-origin:50% 48%; } .deck { width:100vw; height:clamp(410px,61vh,520px); } .card { width:clamp(205px,62vw,258px); height:clamp(260px,73vw,316px); border-radius:23px; padding:22px; } .card__number { font-size:47px; } .card h2 { font-size:22px; } .stage__halo { width:132vw; top:48%; } .stage__floor { width:130vw; top:66%; } .stage__note { font-size:7px; bottom:21px; } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; animation-iteration-count:1!important; } }
    </style>
  </head>
  <body>
    <div class="site" id="top">
      <header class="nav">
        <a class="brand" href="#top" aria-label="TBN LAB 首页">TBN <span>LAB</span><i></i></a>
        <nav class="nav__links" aria-label="主导航"><button type="button" data-nav="HOME">HOME</button><button type="button" data-nav="ABOUT">ABOUT</button><button type="button" data-nav="CONTACT">CONTACT</button></nav>
      </header>
      <main class="stage" id="directory" aria-label="TBN LAB 业务目录">
        <div class="stage__halo" aria-hidden="true"></div><div class="stage__floor" aria-hidden="true"></div>
        <section class="deck" aria-label="拖动或滚动浏览业务目录">
          <button class="card" type="button" data-paper="about" data-title="关于我们" data-kicker="TBN LAB / 01"><span class="card__top"><span class="card__number">01</span><span class="card__rule"></span></span><span class="card__copy"><h2>关于我们</h2><p>ABOUT TBN</p></span></button>
          <button class="card" type="button" data-title="文旅、演唱会" data-kicker="TBN LAB / 02"><span class="card__top"><span class="card__number">02</span><span class="card__rule"></span></span><span class="card__copy"><h2>文旅、演唱会</h2><p>CULTURE &amp; CONCERTS</p></span></button>
          <button class="card" type="button" data-url="artists/index.html" data-title="TBN艺人" data-kicker="TBN LAB / 03"><span class="card__top"><span class="card__number">03</span><span class="card__rule"></span></span><span class="card__copy"><h2>TBN艺人</h2><p>TBN ARTISTS</p></span></button>
          <button class="card" type="button" data-url="club/index.html" data-title="夜经济娱乐" data-kicker="TBN LAB / 04"><span class="card__top"><span class="card__number">04</span><span class="card__rule"></span></span><span class="card__copy"><h2>夜经济娱乐</h2><p>NIGHTLIFE &amp; ENTERTAINMENT</p></span></button>
          <button class="card" type="button" data-title="联系我们" data-kicker="TBN LAB / 05"><span class="card__top"><span class="card__number">05</span><span class="card__rule"></span></span><span class="card__copy"><h2>联系我们</h2><p>CONTACT TBN</p></span></button>
        </section>
        <p class="stage__note">SCROLL / DRAG TO EXPLORE</p>
      </main>
    </div>
    <div class="coming-soon" id="coming-soon" role="dialog" aria-modal="true" aria-label="建站中" aria-hidden="true"><div class="coming-soon__panel"><div class="coming-soon__context"><span id="coming-soon-kicker">TBN LAB</span><strong id="coming-soon-title">正在建设</strong><p id="coming-soon-status">COMING SOON</p></div><button class="coming-soon__close" type="button" aria-label="关闭提示">×</button><iframe id="three-d-paper-frame" class="three-d-paper-frame" title="TBN LAB — 页面建设中" src="threeui/3d-paper/sources/tbn-coming-soon-blue.html?construction=1" sandbox="allow-scripts" loading="eager"></iframe></div></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      const stage=document.querySelector('.stage'),deck=document.querySelector('.deck'),cards=[...document.querySelectorAll('.card')],modal=document.querySelector('#coming-soon'),close=document.querySelector('.coming-soon__close'),modalKicker=document.querySelector('#coming-soon-kicker'),modalTitle=document.querySelector('#coming-soon-title'),modalStatus=document.querySelector('#coming-soon-status'),paperFrame=document.querySelector('#three-d-paper-frame'),reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches,hasGsap=typeof window.gsap!=='undefined';
      const scene={target:0,offset:0,velocity:0,parallaxX:0,parallaxY:0,dragging:false,transitioning:false,hovered:-1,focus:new Array(cards.length).fill(0),frame:0};
      const desktop={originX:0,pitch:146,rise:7,depth:.78,rotate:52,size:340},mobile={originX:0,pitch:112,rise:5,depth:.58,rotate:34,size:244},clamp=(v,min,max)=>Math.min(max,Math.max(min,v)),positions=()=>window.innerWidth<=760?mobile:desktop;
      const cardSetters=hasGsap?cards.map(card=>({x:gsap.quickSetter(card,'x','px'),y:gsap.quickSetter(card,'y','px'),z:gsap.quickSetter(card,'z','px'),rotationX:gsap.quickSetter(card,'rotationX','deg'),rotationY:gsap.quickSetter(card,'rotationY','deg'),rotation:gsap.quickSetter(card,'rotation','deg'),scale:gsap.quickSetter(card,'scale'),opacity:gsap.quickSetter(card,'opacity')})):null,deckRotationY=hasGsap?gsap.quickSetter(deck,'rotationY','deg'):null,deckRotationX=hasGsap?gsap.quickSetter(deck,'rotationX','deg'):null;
      if(hasGsap) gsap.set(cards,{xPercent:-50,yPercent:-50,force3D:true});
      const setHovered=index=>{ scene.hovered=index; cards.forEach((card,cardIndex)=>{ card.classList.toggle('is-focused',cardIndex===index); card.classList.toggle('is-muted',index!==-1&&cardIndex!==index); }); };
      cards[2]?.classList.add('is-anchor');
      const setCardState=(card,index,layout,velocity,offset,focus,time)=>{ const center=(cards.length-1)/2,position=center-offset/(layout.pitch*.9),cardOffset=index-position,distance=Math.abs(cardOffset),ramp=Math.pow(distance,.68),tilt=Math.min(layout.rotate*ramp,74)*Math.sign(cardOffset),phase=index*.82,wave=Math.sin(offset*.012+phase),idle=Math.sin(time*.72+index*.9),idleDepth=Math.cos(time*.57+index*.74),energy=clamp(velocity*.11,-1,1),anchor=index===Math.round(clamp(position,0,cards.length-1))?1:0,x=layout.originX+cardOffset*layout.pitch+wave*5,y=distance*layout.rise-anchor*13+idle*(anchor?5.2:3.6),z=208-layout.depth*layout.size*ramp+energy*Math.cos(phase)*28+focus*92+idleDepth*4,rotationY=-tilt+energy*cardOffset*3.2+scene.parallaxX*2.1,rotation=cardOffset*1.05+energy*cardOffset+scene.parallaxY*.7+idle*.32,rotationX=energy-scene.parallaxY+idleDepth*.25,isOther=scene.hovered!==-1&&scene.hovered!==index,scale=1+anchor*.065-Math.min(distance*.024,.075)+focus*.032,opacity=isOther?.53:Math.max(.42,1-distance*.16); if(hasGsap){ const set=cardSetters[index]; set.x(x); set.y(y); set.z(z); set.rotationX(rotationX); set.rotationY(rotationY); set.rotation(rotation); set.scale(scale); set.opacity(opacity); } else { card.style.opacity=opacity; card.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) rotateX(${rotationX}deg) rotateY(${rotationY}deg) rotateZ(${rotation}deg) scale(${scale})`; } };
      const render=()=>{ if(!scene.transitioning){ scene.velocity*=.89; scene.target*=.947; scene.offset+=(scene.target-scene.offset)*.075; const layout=positions(),time=reduceMotion?0:performance.now()*.001; cards.forEach((card,index)=>{ const targetFocus=scene.hovered===index?1:0; scene.focus[index]+=(targetFocus-scene.focus[index])*.12; setCardState(card,index,layout,scene.velocity,scene.offset,scene.focus[index],time); }); if(hasGsap){ deckRotationY(scene.parallaxX*-1.45); deckRotationX(scene.parallaxY*.78); } } scene.frame=requestAnimationFrame(render); };
      const cardAtPoint=(x,y)=>cards.map((card,index)=>{ const rect=card.getBoundingClientRect(),z=hasGsap?parseFloat(gsap.getProperty(card,'z'))||0:0; return {card,index,z,inside:x>=rect.left&&x<=rect.right&&y>=rect.top&&y<=rect.bottom}; }).filter(item=>item.inside).sort((a,b)=>b.z-a.z)[0]?.card||null;
      const impulse=delta=>{ if(reduceMotion||scene.transitioning) return; const next=clamp(delta,-130,130); scene.velocity=clamp(scene.velocity+next*.055,-16,16); scene.target=clamp(scene.target+next*.95,-230,230); };
      stage.addEventListener('wheel',event=>{ event.preventDefault(); impulse(event.deltaX||event.deltaY); },{passive:false});
      stage.addEventListener('pointermove',event=>{ const x=(event.clientX/window.innerWidth-.5)*2,y=(event.clientY/window.innerHeight-.5)*2; scene.parallaxX+=(x-scene.parallaxX)*.065; scene.parallaxY+=(y-scene.parallaxY)*.065; },{passive:true});
      let dragStartX=0,dragLastX=0,dragMoved=false,pressedCard=null;
      deck.addEventListener('pointerdown',event=>{ if(scene.transitioning) return; scene.dragging=true; dragMoved=false; pressedCard=event.target.closest('.card')||cardAtPoint(event.clientX,event.clientY); dragStartX=dragLastX=event.clientX; scene.velocity=0; deck.setPointerCapture?.(event.pointerId); });
      deck.addEventListener('pointermove',event=>{ if(!scene.dragging) return; const delta=event.clientX-dragLastX; if(Math.abs(event.clientX-dragStartX)>14) dragMoved=true; scene.target=clamp(scene.target+delta*1.32,-250,250); scene.velocity=clamp(delta*.78,-16,16); dragLastX=event.clientX; });
      const releaseDrag=event=>{ if(!scene.dragging) return; const selected=!dragMoved?pressedCard:null; scene.dragging=false; scene.target=clamp(scene.target+scene.velocity*8,-250,250); deck.releasePointerCapture?.(event.pointerId); pressedCard=null; if(selected) openCard(selected,cards.indexOf(selected)); };
      deck.addEventListener('pointerup',releaseDrag); deck.addEventListener('pointercancel',releaseDrag);
      const openCard=(card,index)=>{ if(scene.transitioning) return; scene.transitioning=true; setHovered(index); cancelAnimationFrame(scene.frame); const others=cards.filter(item=>item!==card),finish=()=>{ if(card.dataset.url){ window.location.assign(card.dataset.url); return; } const isAbout=card.dataset.paper==='about',paperSrc='threeui/3d-paper/sources/tbn-coming-soon-blue.html'+(isAbout?'?about=1':'?construction=1'); if(paperFrame.getAttribute('src')!==paperSrc) paperFrame.setAttribute('src',paperSrc); modal.classList.toggle('is-about',isAbout); modalKicker.textContent=isAbout?'TBN LAB / ABOUT US':card.dataset.kicker; modalTitle.textContent=card.dataset.title; modalStatus.textContent=isAbout?'ABOUT US':'COMING SOON'; paperFrame.title=isAbout?'TBN LAB — About Us':'TBN LAB — 页面建设中'; modal.setAttribute('aria-label',isAbout?'关于我们':'页面建设中'); modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); close.focus(); }; if(reduceMotion||!hasGsap){ finish(); return; } gsap.timeline({defaults:{ease:'power3.inOut'}}).to(others,{autoAlpha:0,scale:.93,z:'-=70',duration:.58,stagger:{each:.035,from:'center'}},0).to(card,{z:'+=210',scale:1.09,duration:.68,ease:'power3.out'},0).to('.stage__halo,.stage__floor,.stage__note',{autoAlpha:.14,duration:.48},.14).to(deck,{autoAlpha:.14,duration:.32},.52).call(finish); };
      cards.forEach((card,index)=>{ card.addEventListener('pointerenter',event=>{ if(event.pointerType==='mouse'&&!scene.dragging) setHovered(index); }); card.addEventListener('pointerleave',event=>{ if(event.pointerType==='mouse') setHovered(-1); }); card.addEventListener('focus',()=>setHovered(index)); card.addEventListener('blur',()=>setHovered(-1)); card.addEventListener('click',()=>{ if(dragMoved){ dragMoved=false; return; } openCard(card,index); }); });
      const closeModal=()=>{ modal.classList.remove('is-open','is-about'); modal.setAttribute('aria-hidden','true'); scene.transitioning=false; setHovered(-1); scene.target=scene.offset=scene.velocity=0; if(hasGsap){ gsap.set(cards,{autoAlpha:1}); gsap.to([deck,'.stage__halo','.stage__floor','.stage__note'],{autoAlpha:1,duration:.45,ease:'power2.out',onComplete:()=>scene.frame=requestAnimationFrame(render)}); } else { cards.forEach(card=>card.style.opacity=1); scene.frame=requestAnimationFrame(render); } };
      close.addEventListener('click',closeModal); modal.addEventListener('click',event=>{ if(event.target===modal) closeModal(); }); document.addEventListener('keydown',event=>{ if(event.key==='Escape'&&modal.classList.contains('is-open')) closeModal(); });
      document.querySelectorAll('[data-nav]').forEach(button=>button.addEventListener('click',()=>{ if(button.dataset.nav==='HOME'){ scene.target=0; setHovered(-1); return; } if(button.dataset.nav==='ABOUT'){ openCard(cards[0],0); return; } openCard(cards[4],4); }));
      if(hasGsap&&!reduceMotion) gsap.set(deck,{transformStyle:'preserve-3d'});
      render();
    </script>
