<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="TBN LAB — 业务目录">
    <title>TBN LAB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root { --ink:#f4f3f8; --muted:rgba(235,230,255,.62); --violet:#7255ff; --violet-soft:#b6a8ff; --void:#050505; }
      * { box-sizing:border-box; }
      html,body { width:100%; min-height:100%; margin:0; background:var(--void); color:var(--ink); }
      body { overflow:hidden; font-family:'Manrope','Noto Sans SC',sans-serif; -webkit-font-smoothing:antialiased; }
      button,a { color:inherit; font:inherit; }
      button { border:0; }
      .site { position:relative; min-height:100svh; overflow:hidden; isolation:isolate; background:radial-gradient(ellipse 57% 54% at 50% 52%,rgba(94,64,184,.14),transparent 59%),radial-gradient(ellipse 45% 42% at 17% 76%,rgba(105,75,190,.08),transparent 74%),#050505; }
      .site::before { position:absolute; z-index:-2; inset:-12%; content:''; opacity:.74; background:radial-gradient(ellipse 32% 42% at 50% 50%,rgba(128,88,255,.19),transparent 68%),radial-gradient(ellipse 31% 27% at 56% 67%,rgba(91,54,205,.11),transparent 72%); filter:blur(26px); pointer-events:none; }
      .site::after { position:absolute; z-index:8; inset:0; content:''; opacity:.1; pointer-events:none; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E"); mix-blend-mode:soft-light; }
      .nav { position:relative; z-index:12; display:flex; align-items:center; justify-content:space-between; height:82px; padding:0 clamp(25px,5.3vw,84px); }
      .brand { display:inline-flex; align-items:baseline; gap:.16em; color:#f7f5ff; font-size:clamp(22px,2vw,29px); font-weight:700; letter-spacing:-.09em; text-decoration:none; }
      .brand span { color:#9f8aff; }
      .brand i { width:6px; height:6px; margin-left:.12em; border-radius:50%; background:#a891ff; box-shadow:0 0 13px rgba(158,130,255,.72); }
      .nav__links { display:flex; align-items:center; gap:clamp(19px,3vw,46px); }
      .nav__links button { padding:8px 0; color:rgba(239,233,255,.68); background:transparent; cursor:pointer; font:500 10px/1 'DM Mono',monospace; letter-spacing:.18em; transition:color .45s ease,text-shadow .45s ease; }
      .nav__links button:hover,.nav__links button:focus-visible { color:#f7f5ff; outline:0; text-shadow:0 0 15px rgba(166,141,255,.52); }
      .stage { position:relative; z-index:1; display:grid; min-height:calc(100svh - 82px); place-items:center; perspective:1500px; perspective-origin:50% 46%; touch-action:none; user-select:none; }
      .stage__halo { position:absolute; left:50%; top:50%; width:min(76vw,1020px); aspect-ratio:1.65; border-radius:50%; opacity:.88; background:radial-gradient(ellipse,rgba(126,92,255,.2),rgba(100,67,205,.07) 34%,transparent 68%); filter:blur(35px); transform:translate(-50%,-47%); pointer-events:none; }
      .stage__floor { position:absolute; left:50%; top:64%; width:min(76vw,1120px); height:190px; border-radius:50%; opacity:.74; background:radial-gradient(ellipse,rgba(113,81,236,.21),rgba(57,35,114,.09) 35%,transparent 71%); filter:blur(25px); transform:translateX(-50%) rotateX(69deg); pointer-events:none; }
      .deck { position:relative; width:min(1040px,94vw); height:min(510px,65vh); transform-style:preserve-3d; will-change:transform; }
      .card { position:absolute; left:50%; top:50%; display:flex; width:clamp(218px,24vw,318px); height:clamp(260px,28vw,370px); flex-direction:column; justify-content:space-between; padding:clamp(22px,2.2vw,31px); overflow:hidden; border:1px solid rgba(214,201,255,.46); border-radius:27px; color:var(--ink); background:linear-gradient(137deg,rgba(190,168,255,.31) 0%,rgba(117,83,231,.34) 31%,rgba(42,25,82,.51) 69%,rgba(12,10,21,.7) 100%); box-shadow:inset 1px 1px 0 rgba(255,255,255,.36),inset -1px -1px 0 rgba(87,54,175,.52),inset 18px 17px 47px rgba(224,211,255,.05),inset -24px -24px 46px rgba(7,4,20,.34),0 24px 52px rgba(0,0,0,.36),0 0 35px rgba(116,83,244,.11); backdrop-filter:blur(16px) saturate(1.08); cursor:grab; text-align:left; transform-style:preserve-3d; will-change:transform,filter,opacity; }
      .card::before { position:absolute; inset:0; content:''; opacity:.88; background:linear-gradient(124deg,rgba(255,255,255,.42),transparent 17% 54%,rgba(183,157,255,.15) 77%,rgba(255,255,255,.06)),radial-gradient(ellipse at 19% 1%,rgba(245,240,255,.22),transparent 27%),radial-gradient(ellipse at 100% 100%,rgba(85,53,188,.32),transparent 62%); pointer-events:none; }
      .card::after { position:absolute; top:-26%; left:-32%; width:28%; height:160%; content:''; opacity:.22; background:linear-gradient(90deg,transparent,rgba(245,238,255,.8),transparent); filter:blur(2px); transform:rotate(18deg); pointer-events:none; }
      .card:active { cursor:grabbing; }
      .card__top,.card__copy { position:relative; z-index:1; transform:translateZ(18px); }
      .card__number { display:block; color:rgba(239,231,255,.78); font:400 clamp(44px,5.2vw,70px)/.9 'Manrope',sans-serif; letter-spacing:-.11em; text-shadow:0 0 18px rgba(204,180,255,.18); }
      .card__rule { display:block; width:25px; height:1px; margin-top:18px; background:rgba(221,207,255,.52); }
      .card h2 { margin:0 0 8px; color:#f5f2fb; font-size:clamp(20px,2.1vw,30px); font-weight:600; letter-spacing:-.07em; line-height:1.12; text-shadow:0 2px 12px rgba(20,10,53,.62); }
      .card p { margin:0; color:rgba(234,226,252,.75); font:500 9px/1.35 'DM Mono',monospace; letter-spacing:.12em; }
      .card.is-focused { border-color:rgba(223,211,255,.84); box-shadow:inset 1px 1px 0 rgba(255,255,255,.65),inset -1px -1px 0 rgba(133,98,255,.6),inset 18px 17px 47px rgba(227,215,255,.12),inset -24px -24px 46px rgba(7,4,20,.3),0 30px 70px rgba(0,0,0,.43),0 0 48px rgba(143,105,255,.34); }
      .card.is-focused::after { opacity:.58; animation:glint 2.4s ease-in-out infinite; }
      .card.is-entering { pointer-events:none; }
      .stage__note { position:absolute; bottom:clamp(21px,3vh,35px); left:50%; z-index:4; margin:0; color:rgba(225,216,250,.37); font:500 8px/1 'DM Mono',monospace; letter-spacing:.22em; transform:translateX(-50%); white-space:nowrap; pointer-events:none; }
      .coming-soon { position:fixed; z-index:30; inset:0; display:grid; visibility:hidden; place-items:center; padding:24px; opacity:0; background:rgba(4,3,8,.77); backdrop-filter:blur(16px); transition:opacity .45s ease,visibility .45s ease; }
      .coming-soon.is-open { visibility:visible; opacity:1; }
      .coming-soon__panel { position:relative; width:min(900px,100%); height:min(72svh,640px); min-height:410px; overflow:hidden; border:1px solid rgba(193,174,255,.47); border-radius:24px; background:#0b0813; box-shadow:0 30px 85px rgba(0,0,0,.68),0 0 70px rgba(111,77,235,.22),inset 0 1px 0 rgba(245,238,255,.18); }
      .three-d-paper-frame { display:block; width:100%; height:100%; border:0; background:#07050c; }
      .coming-soon__context { position:absolute; z-index:2; top:clamp(18px,3vw,30px); left:clamp(20px,4vw,42px); max-width:220px; pointer-events:none; }
      .coming-soon__context span { display:block; color:#b6a8ff; font:500 9px/1.3 'DM Mono',monospace; letter-spacing:.16em; }
      .coming-soon__context strong { display:block; margin-top:8px; color:#f7f4ff; font:600 clamp(18px,2vw,26px)/1.08 'Manrope','Noto Sans SC',sans-serif; letter-spacing:-.05em; }
      .coming-soon__context p { margin:7px 0 0; color:rgba(232,224,255,.7); font-size:11px; line-height:1.55; }
      .coming-soon__close { position:absolute; top:16px; right:16px; z-index:2; display:grid; width:34px; height:34px; place-items:center; border:1px solid rgba(215,204,255,.46); border-radius:50%; color:#fff; background:rgba(12,8,24,.54); cursor:pointer; font:300 25px/1 'Manrope',sans-serif; backdrop-filter:blur(9px); transition:background .35s ease,transform .45s cubic-bezier(.16,.84,.2,1); }
      .coming-soon__close:hover,.coming-soon__close:focus-visible { outline:0; background:rgba(182,161,255,.2); transform:rotate(90deg); }
      @keyframes glint { 0%,60%,100% { transform:translateX(0) rotate(18deg); } 76% { transform:translateX(530%) rotate(18deg); } }
      @media (max-width:760px) { .nav { height:70px; padding:0 20px; } .brand { font-size:24px; } .nav__links { gap:17px; } .nav__links button { font-size:8px; letter-spacing:.12em; } .stage { min-height:calc(100svh - 70px); perspective:960px; perspective-origin:50% 48%; } .deck { width:100vw; height:clamp(410px,61vh,520px); } .card { width:clamp(205px,62vw,258px); height:clamp(260px,73vw,316px); border-radius:23px; padding:22px; } .card__number { font-size:47px; } .card h2 { font-size:22px; } .stage__halo { width:132vw; top:48%; } .stage__floor { width:130vw; top:66%; } .stage__note { font-size:7px; bottom:21px; } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; animation-iteration-count:1!important; } }
    </style>
  </head>
  <body>
    <div class="site" id="top">
      <header class="nav">
        <a class="brand" href="#top" aria-label="TBN LAB 首页">TBN <span>LAB</span><i></i></a>
        <nav class="nav__links" aria-label="主导航"><button type="button" data-nav="HOME">HOME</button><button type="button" data-nav="ABOUT">ABOUT</button><button type="button" data-nav="CONTACT">CONTACT</button></nav>
      </header>
      <main class="stage" id="directory" aria-label="TBN LAB 业务目录">
        <div class="stage__halo" aria-hidden="true"></div><div class="stage__floor" aria-hidden="true"></div>
        <section class="deck" aria-label="拖动或滚动浏览业务目录">
          <button class="card" type="button" data-title="夜经济酒吧" data-kicker="TBN LAB / 01"><span class="card__top"><span class="card__number">01</span><span class="card__rule"></span></span><span class="card__copy"><h2>夜经济酒吧</h2><p>NIGHTLIFE &amp; BAR</p></span></button>
          <button class="card" type="button" data-url="artists/index.html" data-title="KPOP艺人资源" data-kicker="TBN LAB / 02"><span class="card__top"><span class="card__number">02</span><span class="card__rule"></span></span><span class="card__copy"><h2>KPOP艺人资源</h2><p>KPOP ARTIST RESOURCES</p></span></button>
          <button class="card" type="button" data-title="文旅" data-kicker="TBN LAB / 03"><span class="card__top"><span class="card__number">03</span><span class="card__rule"></span></span><span class="card__copy"><h2>文旅</h2><p>CULTURE &amp; TOURISM</p></span></button>
          <button class="card" type="button" data-title="商业策划" data-kicker="TBN LAB / 04"><span class="card__top"><span class="card__number">04</span><span class="card__rule"></span></span><span class="card__copy"><h2>商业策划</h2><p>BUSINESS PLANNING</p></span></button>
          <button class="card" type="button" data-title="创始人介绍" data-kicker="TBN LAB / 05"><span class="card__top"><span class="card__number">05</span><span class="card__rule"></span></span><span class="card__copy"><h2>创始人介绍</h2><p>FOUNDER</p></span></button>
        </section>
        <p class="stage__note">SCROLL / DRAG TO EXPLORE</p>
      </main>
    </div>
    <div class="coming-soon" id="coming-soon" role="dialog" aria-modal="true" aria-label="建站中" aria-hidden="true"><div class="coming-soon__panel"><div class="coming-soon__context"><span id="coming-soon-kicker">TBN LAB</span><strong id="coming-soon-title">正在建设</strong><p>COMING SOON</p></div><button class="coming-soon__close" type="button" aria-label="关闭提示">×</button><iframe class="three-d-paper-frame" title="TBN LAB — Coming Soon" src="threeui/3d-paper/sources/tbn-coming-soon-blue.html" sandbox="allow-scripts" loading="eager"></iframe></div></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      const stage=document.querySelector('.stage'),deck=document.querySelector('.deck'),cards=[...document.querySelectorAll('.card')],modal=document.querySelector('#coming-soon'),close=document.querySelector('.coming-soon__close'),modalKicker=document.querySelector('#coming-soon-kicker'),modalTitle=document.querySelector('#coming-soon-title'),reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches,hasGsap=typeof window.gsap!=='undefined';
      const scene={target:0,offset:0,velocity:0,parallaxX:0,parallaxY:0,dragging:false,transitioning:false,hovered:-1,focus:new Array(cards.length).fill(0),frame:0};
      const desktop=[[-355,112,278,32,-13,-5],[-177,48,82,17,-6,-2],[0,0,184,3,1,0],[181,-51,34,-17,7,2],[358,-106,-118,-32,13,5]],mobile=[[-184,62,138,23,-9,-3],[-91,28,54,12,-4,-1],[0,0,142,2,1,0],[94,-30,34,-12,5,2],[187,-61,-44,-23,10,4]],clamp=(v,min,max)=>Math.min(max,Math.max(min,v)),positions=()=>window.innerWidth<=760?mobile:desktop;
      const setCardState=(card,index,base,velocity,offset,focus)=>{ const phase=index*.82,wave=Math.sin(offset*.012+phase),energy=clamp(velocity*.11,-1,1),x=base[0]+offset*(.18+index*.024)+wave*8,y=base[1]+wave*(10+Math.abs(energy)*13)+energy*(index-2)*5,z=base[2]+energy*Math.cos(phase)*68+Math.abs(energy)*22+focus*92,rotationY=base[3]+energy*(index-2)*4.6+scene.parallaxX*2.3,rotation=base[4]+energy*(index-2)*2.1+scene.parallaxY*.8,rotationX=base[5]+energy*1.6-scene.parallaxY*1.15,isOther=scene.hovered!==-1&&scene.hovered!==index,state={xPercent:-50,yPercent:-50,x,y,z,rotationY,rotation,rotationX,scale:1+focus*.035,opacity:isOther?.53:1,filter:`brightness(${isOther?.68:1+focus*.08}) blur(${isOther?.65:0}px)`,force3D:true}; if(hasGsap) gsap.set(card,state); else card.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) rotateX(${rotationX}deg) rotateY(${rotationY}deg) rotateZ(${rotation}deg) scale(${state.scale})`; };
      const render=()=>{ if(!scene.transitioning){ scene.velocity*=.89; scene.target*=.947; scene.offset+=(scene.target-scene.offset)*.075; const base=positions(); cards.forEach((card,index)=>{ const targetFocus=scene.hovered===index?1:0; scene.focus[index]+=(targetFocus-scene.focus[index])*.12; card.classList.toggle('is-focused',scene.hovered===index); setCardState(card,index,base[index],scene.velocity,scene.offset,scene.focus[index]); }); if(hasGsap) gsap.set(deck,{rotationY:scene.parallaxX*-1.45,rotationX:scene.parallaxY*.78,transformOrigin:'50% 50%',force3D:true}); } scene.frame=requestAnimationFrame(render); };
      const impulse=delta=>{ if(reduceMotion||scene.transitioning) return; const next=clamp(delta,-130,130); scene.velocity=clamp(scene.velocity+next*.055,-16,16); scene.target=clamp(scene.target+next*.95,-230,230); };
      stage.addEventListener('wheel',event=>{ event.preventDefault(); impulse(event.deltaX||event.deltaY); },{passive:false});
      stage.addEventListener('pointermove',event=>{ const x=(event.clientX/window.innerWidth-.5)*2,y=(event.clientY/window.innerHeight-.5)*2; scene.parallaxX+=(x-scene.parallaxX)*.065; scene.parallaxY+=(y-scene.parallaxY)*.065; },{passive:true});
      let dragStartX=0,dragLastX=0,dragMoved=false,pressedCard=null;
      deck.addEventListener('pointerdown',event=>{ if(scene.transitioning) return; scene.dragging=true; dragMoved=false; pressedCard=event.target.closest('.card'); dragStartX=dragLastX=event.clientX; scene.velocity=0; deck.setPointerCapture?.(event.pointerId); });
      deck.addEventListener('pointermove',event=>{ if(!scene.dragging) return; const delta=event.clientX-dragLastX; if(Math.abs(event.clientX-dragStartX)>14) dragMoved=true; scene.target=clamp(scene.target+delta*1.32,-250,250); scene.velocity=clamp(delta*.78,-16,16); dragLastX=event.clientX; });
      const releaseDrag=event=>{ if(!scene.dragging) return; const selected=!dragMoved?pressedCard:null; scene.dragging=false; scene.target=clamp(scene.target+scene.velocity*8,-250,250); deck.releasePointerCapture?.(event.pointerId); pressedCard=null; if(selected) openCard(selected,cards.indexOf(selected)); };
      deck.addEventListener('pointerup',releaseDrag); deck.addEventListener('pointercancel',releaseDrag);
      const openCard=(card,index)=>{ if(scene.transitioning) return; scene.transitioning=true; scene.hovered=index; cancelAnimationFrame(scene.frame); const others=cards.filter(item=>item!==card),finish=()=>{ if(card.dataset.url){ window.location.assign(card.dataset.url); return; } modalKicker.textContent=card.dataset.kicker; modalTitle.textContent=card.dataset.title; modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); close.focus(); }; if(reduceMotion||!hasGsap){ finish(); return; } gsap.timeline({defaults:{ease:'power3.inOut'}}).to(others,{autoAlpha:0,scale:.93,z:'-=70',duration:.58,stagger:{each:.035,from:'center'}},0).to(card,{z:'+=210',scale:1.09,duration:.68,ease:'power3.out'},0).to('.stage__halo,.stage__floor,.stage__note',{autoAlpha:.14,duration:.48},.14).to(deck,{autoAlpha:.14,duration:.32},.52).call(finish); };
      cards.forEach((card,index)=>{ card.addEventListener('pointerenter',event=>{ if(event.pointerType==='mouse'&&!scene.dragging) scene.hovered=index; }); card.addEventListener('pointerleave',event=>{ if(event.pointerType==='mouse') scene.hovered=-1; }); card.addEventListener('focus',()=>scene.hovered=index); card.addEventListener('blur',()=>scene.hovered=-1); card.addEventListener('click',event=>{ if(event.detail===0) openCard(card,index); }); });
      const closeModal=()=>{ modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true'); scene.transitioning=false; scene.hovered=-1; scene.target=scene.offset=scene.velocity=0; if(hasGsap) gsap.to([deck,'.stage__halo','.stage__floor','.stage__note'],{autoAlpha:1,duration:.45,ease:'power2.out',onComplete:()=>scene.frame=requestAnimationFrame(render)}); else scene.frame=requestAnimationFrame(render); };
      close.addEventListener('click',closeModal); modal.addEventListener('click',event=>{ if(event.target===modal) closeModal(); }); document.addEventListener('keydown',event=>{ if(event.key==='Escape'&&modal.classList.contains('is-open')) closeModal(); });
      document.querySelectorAll('[data-nav]').forEach(button=>button.addEventListener('click',()=>{ if(button.dataset.nav==='HOME'){ scene.target=0; scene.hovered=-1; return; } modalKicker.textContent='TBN LAB / '+button.dataset.nav; modalTitle.textContent=button.dataset.nav==='ABOUT'?'关于 TBN LAB':'联系 TBN LAB'; modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); close.focus(); }));
      if(hasGsap&&!reduceMotion) gsap.set(deck,{transformStyle:'preserve-3d'});
      render();
    </script>
  </body>
</html>
