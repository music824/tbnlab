<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="TBN LAB — 文化娱乐项目与资源整合">
  <title>TBN LAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#000;--navy:#030923;--navy-card:#041a53;--paper:#fff;--muted:rgba(255,255,255,.52);--line:rgba(0,89,255,.28);--blue:#0059ff;--blue-soft:#8aafff;--ease:cubic-bezier(.18,.82,.22,1)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:var(--ink);color:var(--paper)}body{overflow:hidden;font-family:'Manrope','Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased}button,a{color:inherit;font:inherit}button{border:0}
    .site{position:relative;min-height:100svh;height:100dvh;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 52%,rgba(0,89,255,.16),transparent 35%),linear-gradient(125deg,#000 0,var(--navy) 54%,#000 100%)}
    .site::after{position:absolute;z-index:-1;inset:0;content:'';opacity:.12;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.22) .45px,transparent .45px);background-size:5px 5px;mask-image:linear-gradient(to bottom,transparent 0,#000 28%,#000 78%,transparent 100%)}

    .brand{display:flex;align-items:baseline;gap:9px;text-decoration:none}.brand strong{font-size:clamp(21px,2vw,29px);font-weight:800;letter-spacing:-.08em}.brand span{color:var(--blue-soft);font:500 9px/1 'DM Mono',monospace;letter-spacing:.24em}.nav{display:flex;gap:clamp(20px,3vw,46px)}.nav button{position:relative;padding:9px 0;color:rgba(238,243,253,.54);background:none;cursor:pointer;font:500 8px/1 'DM Mono',monospace;letter-spacing:.22em;transition:color .4s ease}.nav button::after{position:absolute;left:0;bottom:1px;width:0;height:1px;content:'';background:var(--blue-soft);transition:width .5s var(--ease)}.nav button:hover,.nav button:focus-visible,.nav button[aria-current="page"]{color:#fff;outline:0}.nav button:hover::after,.nav button:focus-visible::after,.nav button[aria-current="page"]::after{width:15px}
    .hero{position:relative;height:calc(100dvh - 88px);min-height:0}.hero__label{position:absolute;z-index:8;left:clamp(22px,4.6vw,72px);top:7%;margin:0;color:rgba(231,239,255,.35);font:500 8px/1.7 'DM Mono',monospace;letter-spacing:.23em}.hero__label::before{display:inline-block;width:28px;height:1px;margin-right:12px;content:'';vertical-align:middle;background:var(--blue)}

    .card--01{--x:-280px;--y:-82px;--z:1;--delay:80ms}.card--02{--x:-142px;--y:-41px;--z:2;--delay:150ms}.card--03{--x:0px;--y:0px;--z:3;--delay:220ms;background:linear-gradient(145deg,rgba(0,89,255,.44),rgba(4,26,83,.94) 58%,rgba(3,9,35,.98))}.card--04{--x:142px;--y:41px;--z:4;--delay:290ms}.card--05{--x:280px;--y:82px;--z:5;--delay:360ms}
    .card__content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start}.card__meta,.card__foot{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;width:100%}.card__meta{margin-top:13px}.card__number{font:500 10px/1 'DM Mono',monospace;letter-spacing:.2em}.card__mark{display:grid;width:29px;height:29px;place-items:center;border:1px solid rgba(215,229,255,.18);border-radius:50%;color:rgba(226,237,255,.48);font-size:14px;transform:skewY(7deg);transition:transform .6s var(--ease),border-color .4s ease,color .4s ease}.card__title{position:relative;z-index:2;display:block;margin:0;font:800 clamp(24px,2.3vw,36px)/1 'Noto Sans SC',sans-serif;letter-spacing:-.06em}.card__english{position:relative;z-index:2;display:block;margin-top:7px;color:rgba(225,235,251,.48);font:500 8px/1.35 'DM Mono',monospace;letter-spacing:.17em}.card__foot{margin-top:auto}.card__line{width:42px;height:1px;background:linear-gradient(90deg,var(--blue-soft),transparent)}
    .card-stage:has(.card:hover) .card:not(:hover),.card-stage:has(.card:focus-visible) .card:not(:focus-visible){filter:brightness(.34) saturate(.66)}.card:hover,.card:focus-visible{outline:0;border-color:rgba(0,89,255,.92);background:linear-gradient(145deg,rgba(0,89,255,.78),rgba(4,26,83,.96) 62%,rgba(3,9,35,.98));box-shadow:0 34px 82px rgba(0,0,0,.64),0 0 46px rgba(0,89,255,.26),inset 0 1px rgba(255,255,255,.18);transform:translate3d(calc(-50% + var(--x)),calc(-50% + var(--y) - 44px),0) skewY(-7deg)}.card:hover::before,.card:focus-visible::before{opacity:1}.card:hover::after,.card:focus-visible::after{opacity:.08}.card:hover .card__mark,.card:focus-visible .card__mark{color:#fff;border-color:rgba(255,255,255,.58);transform:skewY(7deg) rotate(-34deg)}
    .footer{position:absolute;z-index:8;left:clamp(22px,4.6vw,72px);right:clamp(22px,4.6vw,72px);bottom:clamp(22px,3.4vh,38px);display:flex;align-items:flex-end;justify-content:space-between;color:rgba(223,233,250,.3);font:500 7px/1.7 'DM Mono',monospace;letter-spacing:.2em}.footer__right{text-align:right}.footer i{display:inline-block;width:46px;height:1px;margin:0 12px 2px;background:rgba(222,234,255,.3)}
    .transition{position:fixed;z-index:50;inset:0;visibility:hidden;opacity:0;background:#000;pointer-events:none;transition:opacity .55s ease,visibility .55s ease}.transition::before{position:absolute;left:var(--ox,50%);top:var(--oy,50%);width:40vmax;height:40vmax;content:'';border-radius:50%;background:radial-gradient(circle,rgba(0,89,255,.62),rgba(4,26,83,.94) 50%,var(--navy) 72%);filter:blur(18px);transform:translate(-50%,-50%) scale(.08);transition:transform .78s var(--ease)}.transition.is-active{visibility:visible;opacity:1}.transition.is-active::before{transform:translate(-50%,-50%) scale(4)}.transition span{position:absolute;right:5vw;bottom:5vh;color:rgba(255,255,255,.11);font:700 clamp(90px,17vw,260px)/.8 'Manrope',sans-serif;letter-spacing:-.1em}.is-leaving .card-stage{opacity:.08;transform:translate(-50%,-50%) scale(1.05);transition:opacity .5s ease,transform .75s var(--ease)}.is-leaving .topbar,.is-leaving .hero__label,.is-leaving .footer{opacity:0;transition:opacity .32s ease}
    .panel{position:fixed;z-index:60;inset:0;display:grid;visibility:hidden;grid-template-columns:minmax(230px,34vw) 1fr;overflow:auto;overflow-x:hidden;background:transparent;pointer-events:none;transition:visibility 0s linear .9s}.panel.is-open{visibility:visible;pointer-events:auto;transition:visibility 0s}.panel__visual{position:relative;min-height:100svh;overflow:hidden;background:transparent}.panel__visual strong{--ghost-size:clamp(80px,min(14.5vw,15vh),238px);position:absolute;left:calc(var(--ghost-size) + clamp(18px,2vw,30px));bottom:-110px;color:rgba(231,240,255,.1);font:700 var(--ghost-size)/1 'Manrope',sans-serif;letter-spacing:.035em;white-space:nowrap;opacity:0;filter:blur(7px);transform:rotate(-90deg);transform-origin:left bottom;transition:bottom 1s var(--ease),opacity .68s ease,filter .8s ease;will-change:bottom,opacity,filter}.panel.is-open .panel__visual strong{bottom:clamp(24px,4vh,46px);opacity:1;filter:blur(0);transition-delay:.42s}.panel__content{position:relative;display:flex;min-height:100svh;flex-direction:column;justify-content:center;padding:clamp(84px,10vw,160px) clamp(34px,9vw,140px);background:#05070b;box-shadow:-34px 0 90px rgba(1,4,11,.42);transform:translate3d(102%,0,0);transition:transform .78s cubic-bezier(.2,.76,.22,1);will-change:transform}.panel.is-open .panel__content{transform:translate3d(0,0,0);transition-delay:.17s}.panel__kicker{color:var(--blue-soft);font:500 9px/1.4 'DM Mono',monospace;letter-spacing:.22em}.panel__title{margin:24px 0 34px;font:800 clamp(42px,7vw,102px)/.92 'Noto Sans SC',sans-serif;letter-spacing:-.075em}.panel__body{max-width:690px;color:rgba(228,236,248,.68);font-size:clamp(15px,1.25vw,19px);line-height:1.95}.panel__body p{margin:0 0 18px}.panel__status{margin:0;color:#f5f8ff;font:600 clamp(52px,7vw,106px)/.82 'Manrope',sans-serif;letter-spacing:-.08em}.panel__status span{display:block;color:var(--blue-soft)}.panel__tagline{margin-top:28px;color:rgba(220,231,248,.42);font:500 10px/1.5 'DM Mono',monospace;letter-spacing:.18em}.panel__kicker,.panel__title,.panel__body>*{opacity:0;filter:blur(5px);transform:translate3d(36px,0,0);transition:opacity .5s ease,filter .65s ease,transform .68s var(--ease)}.panel.is-open .panel__kicker,.panel.is-open .panel__title,.panel.is-open .panel__body>*{opacity:1;filter:blur(0);transform:translate3d(0,0,0)}.panel.is-open .panel__kicker{transition-delay:.82s}.panel.is-open .panel__title{transition-delay:.93s}.panel.is-open .panel__body>:nth-child(1){transition-delay:1.04s}.panel.is-open .panel__body>:nth-child(2){transition-delay:1.12s}.panel.is-open .panel__body>:nth-child(3){transition-delay:1.2s}.panel.is-open .panel__body>:nth-child(4){transition-delay:1.28s}.panel__close{position:fixed;z-index:62;top:24px;right:clamp(24px,4vw,62px);display:grid;width:44px;height:44px;place-items:center;border:1px solid rgba(222,234,251,.28);border-radius:50%;color:#fff;background:rgba(4,7,13,.38);cursor:pointer;font-size:24px;opacity:0;pointer-events:none;backdrop-filter:blur(10px);transform:translate3d(18px,0,0);transition:background .35s ease,opacity .42s ease,transform .55s var(--ease)}.panel.is-open .panel__close{opacity:1;pointer-events:auto;transform:translate3d(0,0,0);transition-delay:0s,1.02s,1.02s}.panel__close:hover,.panel__close:focus-visible{outline:0;background:rgba(58,116,239,.28);transform:rotate(90deg)}
    .panel__content{background:#000;box-shadow:-34px 0 90px rgba(3,9,35,.58)}.panel__status span{color:var(--blue)}.panel__close{background:rgba(3,9,35,.7)}.panel__close:hover,.panel__close:focus-visible{background:rgba(0,89,255,.28)}
    @media(max-width:980px){.card-stage{transform:translate(-50%,-50%) scale(.8)}.hero__label{top:5%}}
    @media(max-width:700px){.topbar{height:70px;padding:0 19px}.brand strong{font-size:22px}.brand span{display:none}.nav{gap:15px}.nav button{font-size:6px}.hero{height:calc(100dvh - 70px)}.hero__label{left:19px;top:4%;font-size:6px}.card-stage{top:49%;width:100%;height:520px;transform:translate(-50%,-50%) scale(.78)}.card{width:278px;height:178px;padding:19px 20px}.card--01{--x:-90px;--y:-132px}.card--02{--x:-44px;--y:-68px}.card--03{--x:0px;--y:0px}.card--04{--x:44px;--y:68px}.card--05{--x:90px;--y:136px}.card__title{font-size:27px}.footer{left:19px;right:19px;bottom:18px}.footer__right{display:none}.panel{grid-template-columns:1fr}.panel__visual{min-height:28svh}.panel__visual strong{writing-mode:horizontal-tb;transform:none;font-size:28vw}.panel__content{min-height:72svh;padding:70px 27px 44px}}
    @media(max-height:720px) and (min-width:701px){.topbar{height:70px}.hero{height:calc(100dvh - 70px)}.card-stage{transform:translate(-50%,-50%) scale(.78)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="site" id="home">
    <header class="topbar"><a class="brand" href="#home" aria-label="TBN LAB 首页"><strong>TBN LAB</strong><span>TO BE NUMBER ONE</span></a><nav class="nav" aria-label="主导航"><button type="button" data-nav="home" aria-current="page">HOME</button><button type="button" data-nav="about">ABOUT</button><button type="button" data-nav="contact">CONTACT</button></nav></header>
    <main class="hero"><p class="hero__label">TBN LAB / DIRECTORY</p>
      <section class="card-stage" aria-label="TBN LAB 业务目录">
        <button class="card card--01" type="button" data-panel="about" data-title="关于我们"><span class="card__content"><span class="card__title">关于我们</span><span class="card__meta"><span class="card__number">01 / ABOUT</span><span class="card__mark">↗</span></span><span class="card__english">ABOUT TBN</span></span><span class="card__foot"><i class="card__line"></i><span class="card__number">01</span></span></button>
        <button class="card card--02" type="button" data-panel="soon" data-title="文旅、演唱会"><span class="card__content"><span class="card__title">文旅、演唱会</span><span class="card__meta"><span class="card__number">02 / CULTURE</span><span class="card__mark">↗</span></span><span class="card__english">CULTURE &amp; CONCERTS</span></span><span class="card__foot"><i class="card__line"></i><span class="card__number">02</span></span></button>
        <button class="card card--03" type="button" data-url="artists/index.html" data-title="TBN艺人"><span class="card__content"><span class="card__title">TBN艺人</span><span class="card__meta"><span class="card__number">03 / ARTISTS</span><span class="card__mark">↗</span></span><span class="card__english">TBN ARTISTS</span></span><span class="card__foot"><i class="card__line"></i><span class="card__number">03</span></span></button>
        <button class="card card--04" type="button" data-url="club/index.html" data-title="夜经济娱乐"><span class="card__content"><span class="card__title">夜经济娱乐</span><span class="card__meta"><span class="card__number">04 / NIGHT</span><span class="card__mark">↗</span></span><span class="card__english">NIGHT ECONOMY</span></span><span class="card__foot"><i class="card__line"></i><span class="card__number">04</span></span></button>
        <button class="card card--05" type="button" data-panel="soon" data-title="联系我们"><span class="card__content"><span class="card__title">联系我们</span><span class="card__meta"><span class="card__number">05 / CONTACT</span><span class="card__mark">↗</span></span><span class="card__english">CONTACT TBN</span></span><span class="card__foot"><i class="card__line"></i><span class="card__number">05</span></span></button>
      </section>
      <footer class="footer" aria-hidden="true"><span>TBN LAB<br>SHENZHEN · CHINA</span><span class="footer__right"><i></i>SELECT A DIRECTION</span></footer>
    </main>
  </div>
  <div class="transition" id="transition" aria-hidden="true"><span id="transition-number">01</span></div>
  <section class="panel" id="panel" role="dialog" aria-modal="true" aria-hidden="true"><button class="panel__close" type="button" aria-label="关闭">×</button><div class="panel__visual" aria-hidden="true"><strong id="panel-ghost">ABOUT</strong></div><div class="panel__content"><span class="panel__kicker" id="panel-kicker">TBN LAB / 01</span><h2 class="panel__title" id="panel-title">关于我们</h2><div class="panel__body" id="panel-body"></div></div></section>
  <script>
    const body=document.body,cards=[...document.querySelectorAll('.card')],transition=document.querySelector('#transition'),transitionNumber=document.querySelector('#transition-number'),panel=document.querySelector('#panel'),panelClose=document.querySelector('.panel__close'),panelGhost=document.querySelector('#panel-ghost'),panelKicker=document.querySelector('#panel-kicker'),panelTitle=document.querySelector('#panel-title'),panelBody=document.querySelector('#panel-body'),reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const aboutCopy=`<p>TBN实验室，是一家聚焦文化娱乐项目策划与统筹、资源整合、顾问服务和内容传播的综合服务机构。</p><p>业务涵盖夜经济娱乐及酒吧项目全案交付、中韩及K-POP艺人资源整合与演出合作、音乐节与演唱会项目、线上传媒及文旅项目规划。</p><p>在夜经济及酒吧领域，我们结合行业资源、项目经验与TBN内容品牌矩阵，为投资人及项目甲方提供从前期诊断、项目定位、方案策划、空间及品牌设计，到施工统筹、人才引进、开业筹备和经营陪跑的综合服务。</p><p>期待与您携手合作，共同推动项目落地。</p>`,soonCopy=`<p class="panel__status">COMING<span>SOON</span></p><p class="panel__tagline">页面建设中 · TO BE NUMBER ONE</p>`;
    let activeCard=null,busy=false;
    const resetTransition=()=>{body.classList.remove('is-leaving');transition.classList.remove('is-active');busy=false};
    const beginTransition=card=>{const rect=card.getBoundingClientRect();activeCard=card;transitionNumber.textContent=card.querySelector('.card__foot .card__number').textContent;transition.style.setProperty('--ox',`${rect.left+rect.width/2}px`);transition.style.setProperty('--oy',`${rect.top+rect.height/2}px`);body.classList.add('is-leaving');transition.classList.add('is-active')};
    const showPanel=card=>{const isAbout=card.dataset.panel==='about',number=card.querySelector('.card__foot .card__number').textContent;panelGhost.textContent=isAbout?'ABOUT US':'COMING SOON';panelKicker.textContent=`TBN LAB / ${number}`;panelTitle.textContent=card.dataset.title;panelBody.innerHTML=isAbout?aboutCopy:soonCopy;panel.setAttribute('aria-hidden','false');requestAnimationFrame(()=>{panel.classList.add('is-open');setTimeout(()=>{busy=false;panelClose.focus()},reduceMotion?20:1320)})};
    const openCard=card=>{if(busy)return;busy=true;beginTransition(card);setTimeout(()=>{if(card.dataset.url){sessionStorage.setItem('tbn-route-enter','1');location.assign(card.dataset.url)}else showPanel(card)},reduceMotion?20:700)};
    const closePanel=()=>{if(!panel.classList.contains('is-open'))return;busy=true;panel.classList.remove('is-open');panel.setAttribute('aria-hidden','true');setTimeout(()=>{resetTransition();activeCard?.focus();activeCard=null},reduceMotion?20:720)};
    cards.forEach(card=>card.addEventListener('click',()=>openCard(card)));panelClose.addEventListener('click',closePanel);panel.addEventListener('click',event=>{if(event.target===panel)closePanel()});addEventListener('keydown',event=>{if(event.key==='Escape')closePanel()});addEventListener('pageshow',resetTransition);
    document.querySelectorAll('[data-nav]').forEach(button=>button.addEventListener('click',()=>{const target=button.dataset.nav;if(target==='home'){closePanel();cards[2].focus();return}openCard(target==='about'?cards[0]:cards[4])}));requestAnimationFrame(()=>body.classList.add('is-ready'));
  </script>
</body>
</html>
